  {id:"wangshu",name:"Wang Shu",org:"业余建筑工作室 / 中国美院",title:"王澍 · 中国首位 Pritzker 2012 · 象山校区",field:["architect","chinese"],
    bio:"1963 生于乌鲁木齐。东南大学建筑学士 + 同济大学博士。1997 与陆文宇创立「业余建筑工作室」(杭州)。中国美术学院建筑艺术学院院长。Pritzker Prize 2012(首位获奖中国建筑师)。代表作:中国美院象山校区(2007/2013)、宁波博物馆(2008)、宁波美术馆(2005)、富阳博物馆(2016)、文村乡村重建(2016)。象山校区使用 700 万片回收砖瓦,定义中国当代「向传统、向乡土」建筑路径。AIA Gold Medal 2025。",
    papers:[{y:"2002",t:"苏州大学文正学院图书馆"},{y:"2005",t:"宁波美术馆"},{y:"2007",t:"中国美院象山校区一期"},{y:"2008",t:"宁波博物馆"},{y:"2013",t:"中国美院象山校区二期"},{y:"2016",t:"富阳博物馆 + 文村乡村重建"}]},
  {id:"liujiakun",name:"Liu Jiakun",org:"家琨建筑设计事务所",title:"刘家琨 · Pritzker 2025 · 西村大院",field:["architect","chinese"],
    bio:"1956 生于成都。重庆建筑工程学院(今重庆大学)毕业。1999 创办家琨建筑设计事务所。Pritzker Prize 2025(中国第二位获奖建筑师)。代表作:西村大院(成都 2015)、鹿野苑石刻艺术博物馆(2002)、Novartis 上海办公园区、四川美术学院新校区。「再生砖」项目(2008 汶川地震后,把废墟材料做成强度更高的砖块)。普利兹克评审主席评价:「刘家琨开创了一种新的共生方式,密度不再与开放性对立」。",
    papers:[{y:"1999",t:"罗中立工作室 重庆"},{y:"2002",t:"鹿野苑石刻艺术博物馆 成都"},{y:"2008",t:"再生砖项目(汶川地震后)"},{y:"2013",t:"胡慧珊纪念馆(汶川地震遗址)"},{y:"2015",t:"西村大院 成都"},{y:"2017",t:"Novartis 上海研发园区"},{y:"2024",t:"上海玻璃博物馆扩建"}]},
  {id:"yunghochang",name:"Yung Ho Chang",org:"非常建筑 / MIT",title:"张永和 · 非常建筑创办人 · 中国实验建筑先驱",field:["architect","chinese"],
    bio:"1956 生于北京(梁思成的学生张开济之子)。东南大学 + UC Berkeley 硕士。1993 创办「非常建筑」(Atelier FCJZ),中国大陆第一家私人建筑事务所。2005-2010 任 MIT 建筑系主任(华人首位)。Pritzker 评委(2012-2017)。代表作:山雨村(深圳)、二分宅(2002)、Vanke Center 中心(深圳 2009)、垂直玻璃宅(2013)。被誉为中国当代「实验建筑」运动先驱。Harvard / Princeton / 同济等多所大学客座教授,影响整代中国年轻建筑师。",
    papers:[{y:"1993",t:"创办非常建筑 Atelier FCJZ"},{y:"2002",t:"二分宅 Split House"},{y:"2005",t:"任 MIT 建筑系主任(2005-2010)"},{y:"2009",t:"Vanke Center 万科中心 深圳"},{y:"2013",t:"垂直玻璃宅 Vertical Glass House"},{y:"2010",t:"北京西城法源寺改造"}]},
  {id:"mayansong",name:"Ma Yansong",org:"MAD Architects",title:"马岩松 · MAD 创办人 · 中国新生代",field:["architect","chinese"],
    bio:"1975 生于北京。北京建筑工程学院 + Yale Master of Architecture(师从 Zaha Hadid 项目)。曾在 Zaha Hadid Architects 伦敦工作。2004 在北京创办 MAD Architects。代表作:Absolute Towers(加拿大 Mississauga 2012,昵称 Marilyn Monroe Towers)、Harbin Opera House(哈尔滨大剧院 2015)、Lucas Museum of Narrative Art(LA 2025,迪士尼+卢卡斯影业)、Quzhou Sports Park(衢州体育场 2023)、朝阳公园广场(2017)。代表中国建筑师在国际舞台的新生代。",
    papers:[{y:"2012",t:"Absolute Towers 加拿大梦露大厦"},{y:"2015",t:"哈尔滨大剧院"},{y:"2017",t:"朝阳公园广场 北京"},{y:"2019",t:"嘉兴火车站"},{y:"2023",t:"衢州体育场"},{y:"2025",t:"Lucas Museum of Narrative Art LA"}]},
  {id:"lixinggang",name:"Li Xinggang",org:"中国建筑设计研究院",title:"李兴钢 · 鸟巢中方主设计师",field:["architect","chinese"],
    bio:"1969 生于河北。天津大学建筑系。中国建筑设计研究院总建筑师 + 李兴钢工作室。北京 2008 奥运会鸟巢国家体育场中方设计主持人(与 Herzog & de Meuron + 艾未未合作)。2022 北京冬奥会延庆赛区国家雪车雪橇中心、国家高山滑雪中心总设计师。代表作:鸟巢(2008)、绩溪博物馆(2014)、瞬时桃花源、北京冬奥延庆赛区(2022)。中国国家级体育建筑代表设计师。",
    papers:[{y:"2008",t:"鸟巢 北京国家体育场(中方主设计)"},{y:"2010",t:"唐山地震遗址纪念公园"},{y:"2014",t:"绩溪博物馆"},{y:"2016",t:"瞬时桃花源"},{y:"2017",t:"元上都遗址博物馆"},{y:"2022",t:"延庆冬奥赛区(雪车雪橇/高山滑雪)"}]},
  {id:"zhupei",name:"Zhu Pei",org:"朱锫建筑事务所",title:"朱锫 · 当代美术馆建筑代表",field:["architect","chinese"],
    bio:"1962 生于北京。清华大学建筑学士 + Berkeley 硕士。曾任 Richard Meier & Partners(纽约)。2005 创办朱锫建筑事务所(北京)。中央美术学院建筑学院院长(2018-)。代表作:OCT 设计博物馆(深圳 2011)、上海喜马拉雅中心(与矶崎新合作)、寿县文化艺术中心(2019)、Jingdezhen Imperial Kiln Museum(景德镇御窑博物馆 2020,获 RIBA International Prize 提名)、岩茶博物馆。把「场所精神」与中国地域文化材料融合的当代代表。",
    papers:[{y:"2011",t:"OCT 设计博物馆 深圳"},{y:"2010",t:"上海喜马拉雅中心(与矶崎新合作)"},{y:"2012",t:"大理杨丽萍剧场"},{y:"2019",t:"寿县文化艺术中心 安徽"},{y:"2020",t:"景德镇御窑博物馆(RIBA International 提名)"}]},
  {id:"donggong",name:"Dong Gong",org:"直向建筑",title:"董功 · 直向建筑创始人",field:["architect","chinese"],
    bio:"1972 生于北京。清华建筑学士 + UIUC 硕士。曾任 Richard Meier & Partners、Steven Holl Architects。2008 创办直向建筑(北京)。代表作:阿那亚海边图书馆(秦皇岛 2015,「孤独的图书馆」网红建筑)、阿那亚海边教堂(2015)、长江美术馆(太原 2019)、宁海十里红妆博物馆(2020)。把简约现代主义与中国当代生活场景结合的代表。AIA 多次国际奖项。",

// ===================================================================
// D3 GRAPH
// ===================================================================
const W = window.innerWidth;
const H = window.innerHeight - 48;

const svg = d3.select("#main-svg");
const g = svg.append("g");

// Zoom
const zoomBehavior = d3.zoom().scaleExtent([0.15, 5])
  .on("zoom", ({transform}) => g.attr("transform", transform));
svg.call(zoomBehavior);

// 节点光晕:放弃 feGaussianBlur,用纯渐变填充(滤镜在 zoom/pan 时极慢)
const defs = svg.append("defs");
const glowGrad = defs.append("radialGradient").attr("id","glow-grad").attr("cx","50%").attr("cy","50%").attr("r","50%");
glowGrad.append("stop").attr("offset","0%").attr("stop-color","white").attr("stop-opacity",0.55);
glowGrad.append("stop").attr("offset","60%").attr("stop-color","white").attr("stop-opacity",0.18);
glowGrad.append("stop").attr("offset","100%").attr("stop-color","white").attr("stop-opacity",0);

// Force simulation
const simulation = d3.forceSimulation(scholars)
  .force("link", d3.forceLink(connections).id(d=>d.id).distance(d=>{
    if(d.type==="cofounder")return 70;if(d.type==="coauthor")return 95;if(d.type==="advisor")return 110;return 140;
  }).strength(d=>{
    if(d.type==="cofounder")return 0.8;if(d.type==="coauthor")return 0.4;if(d.type==="advisor")return 0.5;return 0.12;
  }))
  .force("charge", d3.forceManyBody().strength(-260).distanceMax(600))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collision", d3.forceCollide().radius(36))
  .force("x", d3.forceX(W/2).strength(0.04))
  .force("y", d3.forceY(H/2).strength(0.04))
  .alphaDecay(0.05)
  .velocityDecay(0.55)
  .alphaMin(0.01);

setTimeout(()=>{ if(simulation.alpha() < 0.05) simulation.stop(); }, 8000);

// Links — use <path> for curved lines
const linkG = g.append("g");
const linkLines = linkG.selectAll("path").data(connections).join("path")
  .attr("class", d => `link-line type-${d.type}`)
  .attr("fill", "none");

// Nodes
const nodeG = g.append("g");
const nodeGroups = nodeG.selectAll("g").data(scholars).join("g")
  .attr("class","node-group")
  .call(d3.drag().on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}));

function nodeSize(d){
  const c=connections.filter(c=>{
    const s=typeof c.source==='object'?c.source.id:c.source;
    const t=typeof c.target==='object'?c.target.id:c.target;
    return s===d.id||t===d.id;
  }).length;
  return Math.min(Math.max(c*1.3+4,5),16);
}

// Glow — 移除 SVG filter,改用纯填充,GPU 友好
nodeGroups.append("circle").attr("class","node-glow")
  .attr("r",d=>nodeSize(d)+6)
  .attr("fill",d=>getColor(d.org))
  .attr("opacity",0.22);

// Circle
nodeGroups.append("circle").attr("class","node-circle")
  .attr("r",d=>nodeSize(d))
  .attr("fill",d=>getColor(d.org))
  .attr("stroke","rgba(255,255,255,0.08)")
  .attr("stroke-width",0.5)
  .style("cursor","pointer");

// Labels — name + org
nodeGroups.append("text").attr("class","node-label node-name-label")
  .attr("dy",d=>nodeSize(d)+13)
  .attr("font-size","10px")
  .attr("letter-spacing","-0.08px")
  .text(d=>d.name);
nodeGroups.append("text").attr("class","node-label node-org-label")
  .attr("dy",d=>nodeSize(d)+23)
  .attr("font-size","8px")
  .attr("letter-spacing","-0.06px")
  .attr("fill","rgba(255,255,255,0.35)")
  .text(d=>d.org);

// Tick — straight lines
simulation.on("tick",()=>{
  linkLines.attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
  nodeGroups.attr("transform",d=>`translate(${d.x},${d.y})`);
});

nodeGroups.on("mouseenter",(event,d)=>{
  const connected = new Set([d.id]);
  connections.forEach(c=>{
    const s=typeof c.source==='object'?c.source.id:c.source;
    const t=typeof c.target==='object'?c.target.id:c.target;
    if(s===d.id)connected.add(t);if(t===d.id)connected.add(s);
  });
  nodeGroups.classed("dimmed",n=>!connected.has(n.id)).classed("highlighted",n=>connected.has(n.id));
  linkLines.classed("dimmed",l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    return s!==d.id&&t!==d.id;
  }).classed("highlighted",l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    return s===d.id||t===d.id;
  });
  // Tooltip
  const zhTip = scholarZh[d.id];
  document.getElementById("tooltip-name").textContent = (currentLang === "zh" && zhTip && zhTip.zhName) ? zhTip.zhName + "  " + d.name : d.name;
  document.getElementById("tooltip-org").textContent=d.org;
  tooltip.classList.add("visible");
}).on("mousemove",(event)=>{
  tooltip.style.left=(event.clientX+14)+"px";
  tooltip.style.top=(event.clientY-10)+"px";
}).on("mouseleave",()=>{
  nodeGroups.classed("dimmed",false).classed("highlighted",false);

});

document.getElementById("search-input").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase().trim();
  if(!q){
    nodeGroups.style("opacity",null);linkLines.style("opacity",null);return;
  }
  const match=new Set();
  scholars.forEach(s=>{
    const zh = (typeof scholarZh !== 'undefined' && scholarZh[s.id]) || {};
    const haystack = [
      s.name, s.org, s.title, s.bio, s.id,
      zh.zhName, zh.title, zh.bio,
      orgAlias[s.org] || '',
      ...((s.papers||[]).map(p => p.t || ''))
    ].filter(Boolean).join(' \n ').toLowerCase();
    if(haystack.includes(q)) match.add(s.id);
  });
  const expanded=new Set(match);
  connections.forEach(c=>{
    const s=typeof c.source==='object'?c.source.id:c.source;
    const t=typeof c.target==='object'?c.target.id:c.target;
    if(match.has(s))expanded.add(t);if(match.has(t))expanded.add(s);
  });
  nodeGroups.style("opacity",d=>match.has(d.id)?1:expanded.has(d.id)?0.4:0.04);
  linkLines.style("opacity",l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    return(match.has(s)||match.has(t))?0.5:0.02;
  });
});

function applyAllFilter(){

  linkLines.style("opacity",l=>{
    const s=typeof l.source==='object'?l.source:scholars.find(x=>x.id===l.source);
    const t=typeof l.target==='object'?l.target:scholars.find(x=>x.id===l.target);
    const hasArch=((s?.field)||[]).includes("architect")||((t?.field)||[]).includes("architect");
    return hasArch?0:null;
  });
}
document.querySelectorAll(".filter-pill").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter-pill").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const f=btn.dataset.filter;
    if(f==="all"){applyAllFilter();return;}
    const match=new Set();
    scholars.forEach(s=>{if(s.field&&s.field.includes(f))match.add(s.id);});
    nodeGroups.style("opacity",d=>match.has(d.id)?1:0.04)
              .style("pointer-events",d=>match.has(d.id)?null:"none");
    linkLines.style("opacity",l=>{
      const s=typeof l.source==='object'?l.source.id:l.source;
      const t=typeof l.target==='object'?l.target.id:l.target;
      return(match.has(s)&&match.has(t))?0.5:0.02;
    });
  });
});

  johnmaeda: { zhName: "约翰·前田", title: "MIT Media Lab → RISD 校长 · 计算设计代表", bio: "1966 生于西雅图。MIT 本硕,筑波大学博士(设计)。1996-2008 MIT Media Lab 教师(创办 SIMPLICITY 研究组)。2008-2013 RISD 校长。2014 加入 eBay,后入 Automattic,现 Everbridge。著作《The Laws of Simplicity》(2006)定义「简洁」作为设计原则。开创计算设计 + 创意编码(影响 Processing 语言)。2001 国家设计奖。AIGA 奖章 2010。" },
  bretvictor: { zhName: "布雷特·维克托", title: "交互设计哲学家 · Inventing on Principle", bio: "约 1976 生。加州理工本,UC 伯克利硕士。苹果人机界面设计师(参与 iPad 概念)。2014 创立 Dynamicland(奥克兰研究实验室)。著名 2012 演讲「Inventing on Principle」——定义了实时反馈交互系统的愿景。后续文章《Up and Down the Ladder of Abstraction》《Magic Ink》《Drawing Dynamic Visualizations》成为 HCI 圈经典。极少出现于公众,但在交互设计圈影响力巨大。" },
  susankare: { zhName: "苏珊·凯尔", title: "Mac 图标设计师 · UI 图标之母", bio: "1954 生于纽约 Ithaca。NYU 艺术史博士。1982 被乔布斯招入苹果。设计原版 Macintosh 全部图标(1984):Happy Mac、垃圾桶、套索、炸弹。创造 Chicago 字体(原版 Mac OS 与 iPod 使用)。1986 与乔布斯一起离开苹果加入 NeXT,后为 Windows 3.0(1991)、IBM、Facebook(早期)、Pinterest 设计图标。AIGA 奖章 2018。最具影响力但鲜为人知的界面设计师。" },
  scottbelsky: { zhName: "斯科特·贝尔斯基", title: "Behance 创始人 · Adobe 创意业务总监", bio: "1980 生于匹兹堡。康奈尔本科,哈佛 MBA。2006 创立 Behance(创意作品集平台,2012 被 Adobe 1.5 亿美金收购)。著作《Making Ideas Happen》(2010)、《The Messy Middle》(2018)。2017 起任 Adobe CSO + EVP Creative Cloud。早期投资:Pinterest、Uber、Sweetgreen、Periscope、Warby Parker。个人博客被设计创业者广泛阅读。" },
  tobiasvanschneider: { zhName: "托比亚斯·范施奈德", title: "前 Spotify 高级设计师 · DESK + 数字游民代表", bio: "约 1986 生于奥地利。自学设计。2014-2017 任 Spotify 高级产品设计师(纽约)。2016 联创 Semplice(设计师专用 CMS)。2017 创立 DESK Studio。2020 联创 Mymind(视觉书签)。Newsletter 20 万+ 订阅,聚焦远程办公 + 设计创业。强烈的独立设计师 / 数字游民声音。" },
  juliezhuo: { zhName: "Julie Zhuo", title: "前 Facebook 产品设计副总裁 · 写作型 PM", bio: "约 1983 生于上海(后移民美国)。斯坦福 CS。2006 加入 Facebook(初为工程师,后转产品设计)。28 岁升任产品设计副总裁(管 200+ 设计师)。著作《The Making of a Manager》(2019)——科技管理畅销书。2020 离开 Facebook 联创 Sundial(数据产品)。Newsletter《Looks Good》在科技圈设计师/管理者中广泛阅读。" },

  // ===== 字体设计 / 其他西方 =====
  wolfgangweingart: { zhName: "沃尔夫冈·韦因加特", title: "瑞士字体学派 → New Wave 革命者", bio: "1941 生于德国 Salem,2021 去世。巴塞尔设计学校。1968 起在巴塞尔教学——初为瑞士风格纯派,但 70 年代激进打破刚性网格,开创「Swiss Punk」/「New Wave」字体设计(混乱混合字体、摄影字体、刻意打破)。影响 April Greiman、Dan Friedman 与一整代后现代设计师。瑞士现代主义与 80 年代解构主义之间的桥梁。" },
  aarondraplin: { zhName: "亚伦·德拉普林", title: "Field Notes 联创 · 美国工匠风设计", bio: "1969 生于底特律。自学(滑雪运动员背景)。2005 在波特兰创立 Draplin Design Co(DDC)。2008 与 Coudal Partners 联创 Field Notes(小本笔记本,售出 5000 万+)。客户:Burton 滑板、耐克、Esquire、Patagonia、Carhartt、Cobra Dogs。著作《Pretty Much Everything》(2016)。代表「粗犷美国工匠」平面设计风格。" },

  // ===== 日本 =====
  kenyahara: { zhName: "原研哉", title: "MUJI 艺术总监 · 「白」哲学", bio: "1958 生于日本冈山。武藏野美术大学。Hara Design Institute 总裁(隶属日本设计中心)。2002 起任 MUJI 艺术总监——定义 MUJI 视觉识别(那些极简「地平线 horizon」广告)。设计 Tsutaya、六本木 Hills 识别。著作《Designing Design》(2007)、《白》(2010)、《Ex-formation》(2017)。开创将「emptiness 留白」作为日本设计哲学输出全球。" },
  okisato: { zhName: "佐藤大(Nendo)", title: "Nendo 创始人 · 日本极简主义代表", bio: "1977 生于多伦多(日籍)。早稻田大学建筑硕士。2002 在东京创立 Nendo。每年 200+ 项目。客户:Cappellini、Camper、Issey Miyake、Tod's、可口可乐、雷克萨斯、星巴克。标志性小巧、玩味、「click moment」产品设计。2012 Wallpaper 年度设计师。东京 2020 奥运火炬设计。" },
  kashiwasato: { zhName: "佐藤可士和", title: "UNIQLO 品牌设计师", bio: "1965 生于东京。多摩美术大学。1989 加入博报堂,2000 创立 Samurai Inc。2006 至今定义 UNIQLO 全球品牌识别(红色方形 logo、店面设计、广告)。设计 7-Eleven 日本品牌、本田 Stepwgn、Tsutaya T-Card、乐天 logo、今治毛巾。日本最有影响力的商业品牌设计师。多摩美术大学客座教授。著《佐藤可士和的超整理术》。" },

  // ===== 中国设计师 =====
  kantaikeung: { zhName: "靳埭强", title: "香港平面设计教父 · 中国银行 logo", bio: "1942 生于广东番禺。香港浸会学院。自学成才,为新华、太古、屈臣氏、中国银行设计 logo(1984 中行红五星 logo 沿用至今)。创办「靳埭强设计奖」推动华人设计教育。受张光宇、王无邪影响,融合中国水墨与现代设计。AGI 会员,香港艺术发展局视觉艺术主席。著作《设计心法》《关于设计的 110 个故事》。在中国大陆与靳与刘合作创立 KL&K Design。" },
  alanchan: { zhName: "陈幼坚", title: "香港品牌设计代表 · 东西合璧", bio: "1950 生于香港。中学毕业自学,1980 创立 Alan Chan Design Company。设计 Tsutaya 香港、HSBC、Watson's、Mandarin Oriental、Shanghai Tang 视觉识别。「东西合璧」最具商业代表性的华人设计师。600+ 国际奖项。2002 创办上海 Alan Chan Creations 工作室。香港艺术中心荣誉院士。1996《时代》评选 'Asia's 25 most influential people'。" },
  hejianping: { zhName: "何见平", title: "Hesign 创始人 · 中德双线运营 · 海报艺术家", bio: "1973 生于浙江。杭州中国美术学院 → 柏林艺术大学。师承 Helmut Schmid。创办 Hesign 工作室(柏林 2003 / 上海 2004)。全球各大海报双年展常胜军(华沙、布鲁诺、墨西哥金奖等 100+)。创办 Hesign 出版社、组织「中国海报双年展」。中国美术学院 + 柏林艺术大学双教职。著作《设计 + 文化》(德文)、《设计的旅行》。" },
  hanjiaying: { zhName: "韩家英", title: "深圳现代品牌设计代表", bio: "1961 生于北京。西安美术学院。1990 南下深圳,1993 创办韩家英设计有限公司。设计万科、招商银行、中国国际海运集装箱、深圳中国设计大展等品牌识别。AGI 会员。中国最早一批将国际设计语言带入大陆品牌的设计师。2008 北京奥运视觉设计核心成员。数次代表中国设计参加国际三年展。" },
  heiyiyang: { zhName: "黑一烊", title: "SenseTeam(山河水)创始人", bio: "1971 生于广东惠州。自学派。2003 创办深圳 SenseTeam(山河水设计)。设计华为终端品牌(Mate 系列视觉)、网易云音乐、龙湖地产、Manner 咖啡等。2010 代表中国登上《Communication Arts》封面。AGI 中国区会员。「黑色」标签是行业 insider 的共识符号。多次操刀「字体设计 + 品牌」交叉项目,推动中文字体在新生代中商业化运用。" },
  zhuzhiwei: { zhName: "朱志伟", title: "方正字库元老 · 兰亭黑/博雅宋设计者", bio: "1956 生于北京。北京印刷学院。1989 加入方正,中国数字字库奠基人之一。主导设计「方正兰亭黑」「方正博雅宋」「方正悠黑」等中文经典字体。兰亭黑被苹果选为 Mac OS X 系统简体中文默认字体(2010 年起)。2018 方正悠黑入选中国第二届字体设计大奖。影响整个中文数字阅读时代的视觉基础。" },
  zhuyingchun: { zhName: "朱赢椿", title: "书籍设计大师 · 世界最美的书获得者", bio: "1970 生于江苏盐城。南京师范大学美术系。南京艺术学院教授 + 书衣坊主持人。设计书籍《不裁》《肥肉》《虫子书》《设计诗》——累计获德国莱比锡「世界最美的书」金奖、中国「最美的书」十多次。「实物 + 概念 + 文学」三位一体的书籍设计开创者。中国最具有「书是物」哲学的设计师。受日本杉浦康平影响。" },
  yangmingjie: { zhName: "杨明洁", title: "中国工业设计代表 · 羊舍创始人", bio: "1971 生于杭州。中国美术学院 + 同济大学 + 慕尼黑工业大学 / 西门子研究院。2005 创办 YANG DESIGN(上海),工业设计 + 产品策略咨询。2014 推出自主品牌「羊舍 Yang House」家具。客户:海尔、华为、奔驰、米其林、可口可乐。出版《设计的醒觉》。中国大陆最商业成熟的工业设计师之一,国际设计奖项最多的中国设计师。" },
  jiawei: { zhName: "賈伟", title: "洛可可 LKK 创始人 · 大中型设计公司模式", bio: "1973 生于太原。北京理工大学工业设计。2004 创办洛可可创新设计集团(LKK),发展为中国规模最大的设计咨询公司之一(800+ 员工 / 全国 8 城市分公司)。客户覆盖海尔、美的、华为、三星、可口可乐 1000+ 品牌。红点/IF 等国际奖项 100+。2018 创办洛客 LKKER 设计众包平台。推动中国从代工(OEM)转向自主设计(ODM)的代表人物。" },
  zhouchenchen: { zhName: "周宸宸 Frank Zhou", title: "国内当代家具设计代表", bio: "1986 生于北京。中央美术学院家具设计 + 米兰理工学院产品设计。2012 创办 Frank Chou Design Studio。受日本/北欧家具影响,但探索中国当代产品语境。设计 Combo 沙发(2017,广州设计周年度家具)、Cube 椅。与意大利 Cassina、丹麦 Stellar Works 合作。代表中国 80/90 后家具设计语言走向国际。米兰设计周中国设计师常驻代表。" },
  lincunzhen: { zhName: "林存真", title: "北京冬奥设计总监 + 字体设计", bio: "1971 生于山东。中央美术学院 + 莱比锡视觉艺术学院博士。中央美术学院设计学院副院长。2022 北京冬奥会会徽「冬梦」主设计师 + 视觉形象设计总监。「方正悠黑」字体合作开发。当代中国具备国际视野且承担国家级视觉项目的代表设计师。" },
  jianghua: { zhName: "蒋华", title: "中国当代字体设计教育者", bio: "1971 生于杭州。中国美术学院视觉传达硕士。中国美术学院设计学院教授。创办「Type is Beautiful」中文字体网志(2007)。著作《这个杀手不太冷:汉字字体设计对话录》。中国最早一批系统性引入西方字体设计理论的学者,影响新一代华文字体设计者。AGI 会员。" },
  wangmin: { zhName: "王敏", title: "央美设计学院前院长 + 北京奥运形象总监", bio: "1956 生于北京。中央工艺美术学院 + 美国耶鲁大学硕士。1990 年代在 Adobe / 苹果 / 微软担任艺术总监。2002 回国任中央美术学院设计学院院长(2002-2018)。2008 北京奥运会形象与景观艺术总监。「奥运同心结」视觉系统主导者。推动中国设计教育与国际接轨,培养整整一代国内设计领导者。" },
  liude: { zhName: "刘德", title: "小米联合创始人 · 工业设计副总裁", bio: "1973 年生。北京理工大学工业设计学士 + 机械设计硕士 + Art Center College of Design 工业设计硕士。2010 年与雷军等八人共同创立小米,长期主管小米硬件工业设计与生态链业务,定义了小米手机/电视/盒子的「极简白」工业设计语言。是中国移动互联网时代第一批将硅谷工业设计教育(Art Center)引入大陆消费电子的领导者。现任小米集团执行董事 + 高级副总裁 + 集团总干部部部长。" },
  liwanqiang: { zhName: "黎万强", title: "小米联合创始人 · 前金山 UI 主管 · Mi 品牌", bio: "小米联合创始人之一,前金山软件 UI 主管。2010 年与雷军等创办小米,主导早期小米品牌识别(MI logo)、MIUI 视觉系统、小米营销与品牌内容。是《参与感》一书的作者(2014 年最畅销互联网营销书,核心案例为小米)。后任小米电视部门总经理。中国互联网产品「品牌-视觉-营销」一体化运作的范式开创者。" },
  tangmu: { zhName: "唐沐", title: "前腾讯 CDC 总经理 → 小米生态链 → 如影智能 CEO", bio: "华南理工大学国际会计学士。第一份工作金山(黎万强是直接 UI 主管)。2003 加入腾讯,组建腾讯用户体验设计中心(CDC),管 300+ 设计师,负责 QQ/QQ 音乐/QQ 游戏等百款产品。早期 QQ 头像出自他手。2013 加入小米任生态链副总裁,主导小米路由器、智能家居产品设计。后离开小米创立北京如影智能科技 CEO。" },
  yangyan: { zhName: "杨颜", title: "魅族 Flyme 事业部副总裁 · Flyme 设计灵魂", bio: "魅族 Flyme OS 视觉与交互设计灵魂人物。2010 年代魅族团队 10 余人时期就主导 Flyme 早期版本设计。2014 年原负责人马麟离职后接任,带领团队迭代 Flyme 4/5/6/7/8 系列。2017 年组织调整后任 Flyme 事业部独立后升任副总裁。Flyme 在 2013-2018 年间被视为中国 Android 定制 ROM 的设计标杆。" },
  luoziyong: { zhName: "罗子雄", title: "前锤子科技设计 → 国内独立设计师代表", bio: "原锤子科技(Smartisan OS)核心 UI 设计师之一,参与早期 Smartisan OS 视觉系统。后离开锤子成为自由设计师,创办 LxU 设计圆桌。在国内设计圈持续输出方法论和职业建议,影响一代中国 80/90 后 UI/产品设计师。Twitter / 微博 / 知乎活跃,是把「设计师如何思考」普及到大众视野的最早一批中文 KOL。" },
  geyanan: { zhName: "葛亚男", title: "vivo OriginOS 设计总监", bio: "vivo OriginOS 设计总监,主导 vivo 自研操作系统视觉与交互设计语言(OriginOS 1.0 → 4.0)。OriginOS 2020 发布以「华容网格」打破国内 Android 定制 ROM 同质化布局,被业内视为继 Flyme 之后中国厂商在 UI 设计上的又一次系统级创新。" },
  ryolu: { zhName: "Ryo Lu", title: "Cursor 设计负责人 · 前 Notion 5 年设计师", bio: "加拿大华裔设计师。早期在 Asana、Stripe 工作。2019-2025 在 Notion 工作 5 年,主导 Notion 视觉与交互系统升级。2025 年 1 月跳槽至 Cursor 任 Head of Design——AI native coding 代表设计师。他在 Cursor 用 Cursor 自己写出 ryOS 个人作品。在 X (@ryolu_) 上是 AI native designer 标志性人物。" },
  ivanzhao: { zhName: "Ivan Zhao", title: "Notion 联创 + CEO · 设计师创业者代表", bio: "出生于中国,童年移居加拿大。UBC 认知科学 + 美术辅修。中学时学编程参加 Olympiad in Informatics。从小研习中国传统水墨。早期在教育出版创业 Inkling 任产品设计师。2013 与 Simon Last 联创 Notion。2019-2020 几乎倒闭后凤凰涅槃,2025 估值超千亿美金。代表 designer-founder 路径——Notion 整个产品哲学源自他对「乐高式知识工具」的执念。" },
  karrisaarinen: { zhName: "Karri Saarinen", title: "Linear 联创 + CEO · 设计师血统的项目工具", bio: "芬兰设计师 + 工程师。早期联创 Kippt(被 Coinbase 收购)。Coinbase 早期设计 + Head of Design。Airbnb Principal Designer + Design Systems Lead。2019 创办 Linear。Linear 以「极致软件 craft」著称,客户包括 OpenAI / Ramp / Vercel。2024 估值 12.5 亿美金。代表「设计师创业者把 craft 信念注入企业级软件」的路径。" },
  joegebbia: { zhName: "Joe Gebbia", title: "Airbnb 联合创始人 · RISD 设计师", bio: "美国设计师。RISD 罗德岛设计学院平面 + 工业设计 BFA(与 Brian Chesky 同班同学 + 室友)。2007 与 Chesky 在 SF 公寓提出 AirBed & Breakfast 想法。2008 年 Y Combinator,2009 改名 Airbnb。在 Airbnb 长期任 Chief Product Officer 直至 2022 年离任。Airbnb 整个产品 + 主机社区文化深受其设计驱动思维影响。" },
  brianchesky: { zhName: "Brian Chesky", title: "Airbnb CEO · 工业设计师 / RISD", bio: "美国工业设计师 + CEO。RISD 工业设计 BFA(2004),冰球队队长。Chesky 把设计驱动文化深植 Airbnb 产品/社区/品牌。2024 与 Jony Ive 的 LoveFrom 启动多年期合作,联合设计 Airbnb 产品改版。是少数把 RISD 设计教育延续到运营整个公司的 CEO 案例。" },
  mikematas: { zhName: "Mike Matas", title: "前苹果 iPhone/iPad UI 设计师 · Push Pop Press 创办人", bio: "美国 UI 设计师。高中末与 Wil Shipley 创办 Delicious Monster(获 Apple Design Award)。19 岁加入苹果 Human Interface 团队,参与原版 iPhone 设计:相机、相册、地图、设置。设计 iPad Photos app、Mac Time Machine、Photo Booth。后参与 Nest 智能恒温器设计。2010 创办 Push Pop Press(被 Facebook 收购)。Facebook Paper 主创。后创办 Lobe.ai(2018 被微软收购)。" },
  soleio: { zhName: "Soleio Cuervo", title: "前 Facebook 早期设计师 → Dropbox VP Design → Combine VC", bio: "美国设计师 + 投资人。第 14 号 Facebook 员工,设计 Like 按钮、News Feed 早期版本。后任 Dropbox VP of Design。2017 创办 Combine VC,专注早期设计师创业投资。投资 Linear、Roam Research、Vercel、Loom 等设计驱动型公司。代表「Facebook 设计黑帮」以投资人身份在硅谷设计创业生态的重要节点。" },
  raunofreiberg: { zhName: "Rauno Freiberg", title: "Vercel 高级 Design Engineer · 「设计 + 工程」代表", bio: "爱沙尼亚设计师 + 前端工程师。Vercel Senior Design Engineer。在 X (@raunofreiberg) 上以高质量微交互/动效演示获 100K+ 关注,被视为 design engineering 这一新兴角色的标志人物。Vercel 官网首页那些丝滑动效大多出自他手。代表「设计师必须懂代码」的 AI native 时代趋势。" },
  bashording: { zhName: "Bas Ording", title: "前苹果 UI 设计师 · iPhone 橡皮筋滚动发明者", bio: "荷兰交互设计师。1998 年 Eindhoven 工业设计学院毕业后被 Steve Jobs 亲自招入苹果。15 年苹果生涯,主导 Mac OS X 的 Dock 放大效果、Exposé,以及 iPhone 最具标志性的「橡皮筋」滚动 + 惯性滚动 + 滑动解锁。这条「rubber band」演示在 2005 年点燃了 Steve Jobs 的「这就是手机」灵光一现。其滚动专利后被 Steve Jobs 用以起诉三星。后期离开苹果加入 Tesla(2013-)。" },
  imranchaudhri: { zhName: "Imran Chaudhri", title: "前苹果 HI 设计师 22 年 · Humane 联创", bio: "出生于伦敦巴基斯坦裔。1995-2017 年在苹果担任 HI 设计师 22 年。原版 iPhone 软件 UI 团队核心成员之一,拥有 50+ 项苹果 UI 专利。2017 与妻子 Bethany Bongiorno 离开苹果创立 Humane,2023 推出 AI Pin(失败),2024 卖给 HP。代表苹果设计黄金时代 HI 团队的灵魂人物之一。" },
  gregchristie: { zhName: "Greg Christie", title: "前苹果 HI 副总裁(2002-2014)", bio: "美国 UI 设计师。1996 加入苹果,2002-2014 担任 Human Interface Group 副总裁。主导 Newton OS、Mac OS X、iPhone、iPad UI 设计。「Slide to Unlock」专利的合作发明人。在 Steve Jobs 时代直接对 Jobs 汇报,管理苹果整个 UI 设计团队。2014 离开苹果。" },
  chrisstringer: { zhName: "Christopher Stringer", title: "前苹果 ID 团队核心(1995-2017)", bio: "英国工业设计师。1995 加入苹果工业设计团队,与 Jony Ive 共事 22 年。原版 iPhone、iPad、Apple Watch、AirPods 工业设计核心成员。在三星专利诉讼中作为苹果证人出庭,首次公开苹果设计部内部会议方式。2017 离开苹果。" },
  bartandre: { zhName: "Bart Andre", title: "苹果 ID 团队元老(1992-)", bio: "加拿大工业设计师。1992 加入苹果工业设计团队,迄今 30+ 年,是 Apple ID 团队最长资历的成员之一。与 Jony Ive 共事整个黄金时代。Apple Watch 主要设计师之一。500+ 苹果硬件专利。Ive 离开后仍留在苹果 ID 团队,延续设计血脉。" },
  alandye: { zhName: "Alan Dye", title: "前苹果 HI 副总裁 · Liquid Glass 主导者 → Meta CDO", bio: "美国设计师。Kate Spade 创意总监出身,2006 加入苹果做营销创意,2015 升任 Apple HI 副总裁。主导 Apple Watch UI、iPhone X、Vision Pro UI,以及 2025 年发布的 Liquid Glass(iOS 26 全面视觉重构,材质化半透明界面语言,从 visionOS 演化而来)。2025 年 12 月被 Meta 以 Chief Design Officer 头衔挖走加入 Reality Labs,负责 Meta 全部硬件 + AI 产品设计。" },
  billatkinson: { zhName: "Bill Atkinson", title: "原版 Mac 灵魂工程-设计师 · MacPaint / HyperCard", bio: "1951 生,2025 去世。原版 Macintosh 团队核心成员。开发 QuickDraw 图形系统(让 Mac 能在像素级精确绘图)、MacPaint(1984,首个商业化绘图软件)、HyperCard(1987,被视为 Web 链接的前身)。在 Mac 工程团队是少数兼具技术深度 + 设计直觉的灵魂人物。" },
  fritzeichler: { zhName: "Fritz Eichler", title: "博朗创意总监 · 招聘 Rams 的人", bio: "1911 生于卢森堡 Differdange,德国艺术史学家、画家、戏剧导演、产品设计师。1953 加入博朗最初为做广告片导演,迅速升任创意总监,定义博朗 1950s-60s 的整体设计哲学。是把 Hans Gugelot、Otl Aicher、Dieter Rams 等设计师招入博朗的关键人物。与 HfG Ulm 建立合作关系,把包豪斯传统通过 Ulm 学派带入博朗。" },
  hansgugelot: { zhName: "Hans Gugelot", title: "HfG Ulm 教授 · 与 Rams 合作 SK 4", bio: "1920 生于印尼,1965 早逝。德国-荷兰工业设计师。HfG Ulm(乌尔姆造型学院)关键人物。与 Dieter Rams 合作设计 1956 年的博朗 SK 4 唱机收音机(被昵称「白雪公主之棺」,MoMA 永久馆藏)。开创了德国战后理性主义工业设计语言,通过 Ulm 学派把包豪斯传统延续到战后德国。" },
  reinholdweiss: { zhName: "Reinhold Weiss", title: "博朗设计师 · 与 Rams 同期", bio: "德国工业设计师。HfG Ulm 毕业。1959-1967 在博朗设计部门与 Dieter Rams、Hans Gugelot 共事。设计博朗多款厨房电器经典作品(吐司机 HT 2 等),首次为博朗引入「黑+银」配色组合(后成为博朗品牌标识)。1967 离开博朗自创工作室,后赴美芝加哥发展。" },
  achillecastiglioni: { zhName: "阿基·卡斯蒂格利奥尼", title: "意大利工业设计大师 · 米兰理工教授(1918-2002)", bio: "1918 生于米兰,2002 去世。米兰理工大学建筑系。与兄弟 Pier Giacomo / Livio 共同创立 Studio Castiglioni 1944,设计 Flos 灯具(Arco 弧光灯 1962、Snoopy 灯 1967、Toio 1962)、Zanotta、Alessi 产品。Compasso d'Oro 金奖 9 次(史上最多)。米兰理工大学建筑系教授(1969-1995),指导 Patricia Urquiola 等一代意大利设计师。1988 年获意大利总统颁发的 Gran Croce 大十字勋章。被誉为意大利战后产品设计的灵魂人物。" },
  ivanchermayeff: { zhName: "Ivan Chermayeff", title: "美国企业识别设计先驱(1932-2017)", bio: "1932 伦敦生,2017 NYC 去世。Harvard、Yale 艺术学院。父亲是建筑师 Serge Chermayeff。1957 与 Tom Geismar 联创 Chermayeff & Geismar。设计美国最经典企业 logo:NBC 孔雀(1986)、Mobil 飞马(1965)、PBS 人脸(1971)、Smithsonian、National Geographic、Pan Am、Chase 银行八边形(1961)。开创美国 mid-century 现代主义企业识别。AIGA 奖章 1979。" },
  tomgeismar: { zhName: "Tom Geismar", title: "Chermayeff & Geismar 联创(1957-)", bio: "1931 生,美国平面设计师。Brown 大学 + Yale 艺术学院。1957 与 Ivan Chermayeff 联创 Chermayeff & Geismar,职业生涯 65+ 年,设计 100+ 个全球企业 logo:Mobil(1964)、Chase(1961)、Burlington Industries、Best Products、Library of Congress 等。AIGA 奖章 1979。Smithsonian Cooper Hewitt 终身成就奖 2014。" },
  saghaviv: { zhName: "Sagi Haviv", title: "C&G&H 现任合伙人 · 第三代", bio: "1974 以色列出生,在美国受教育。Cooper Union 平面设计 BFA。2003 加入 Chermayeff & Geismar,2006 升任合伙人(最年轻的合伙人),公司随后改名 Chermayeff & Geismar & Haviv。设计 Conservation International 三角 logo(2008)、Library of Congress、Harvard University Press、US Open 网球公开赛。代表 C&G 60+ 年血脉的当代延续。" },
  wallyolins: { zhName: "Wally Olins", title: "现代品牌咨询之父(1930-2014)", bio: "1930 伦敦生,2014 去世。St Anne's College Oxford。1965 与设计师 Michael Wolff 联创 Wolff Olins,定义了「企业识别」(corporate identity)作为咨询行业。设计英国电信 BT(1991)、Tate(2000)、奥姆勒姆 2012、Beats by Dre、Royal Mail。著作《Corporate Identity》(1989)、《On Brand》(2003)被视为品牌咨询圣经。CBE 1999。" },
  walterlandor: { zhName: "Walter Landor", title: "美国包装设计先驱(1913-1995)", bio: "1913 慕尼黑生,1995 SF 去世。Goldsmiths College London。1941 移民美国,1941 创立 Landor Associates(SF)。开创现代消费品包装与品牌设计:Coca-Cola 经典曲线、Levi Strauss、Marlboro 红盒、FedEx(1994)、3M、Westinghouse。把消费者品牌咨询从单次设计转为系统化方法论。AIGA 奖章 1988。Landor 1989 被 WPP 收购,至今仍是全球最大品牌咨询公司之一。" },
  gertdumbar: { zhName: "Gert Dumbar", title: "荷兰品牌设计学派 · Studio Dumbar 创始人", bio: "1940 生于印尼万隆(荷兰籍)。Royal College of Art London。1977 在海牙创立 Studio Dumbar。荷兰品牌设计学派代表:KPN(荷兰电信)、Dutch Police 警方、Dutch Postal Service、Apollo 阿波罗剧院、Royal Dutch Mint、Tate Britain。结合摄影、3D 道具与平面设计的「scenographic」方法论开创性地融合戏剧手法与企业识别。Royal Designer for Industry。" },
  davideriksson: { zhName: "David Eriksson", title: "TE 联合创始人", bio: "瑞典设计师。2005 与 Jesper Kouthoofd、Jens Rudberg、Erik Lundstedt 在斯德哥尔摩共同创立 Teenage Engineering。TE 以 OP-1 合成器(2011)、Pocket Operator、IKEA Frekvens 联名、Nothing 早期产品 Nothing CMF 合作著称。「玩具感 + 严肃合成器」美学定义了独立硬件 / 音乐设计圈的新方向。" },
  henrysteiner: { zhName: "石汉瑞 Henry Steiner", title: "香港平面设计之父 · Paul Rand 学生", bio: "1934 生于维也纳犹太家庭,纳粹兴起后逃往美国。Hunter College + Yale 艺术学院 MFA(师从 Paul Rand)。1961 受邀到香港任《亚洲杂志》设计总监,原计划 9 个月但定居至今。1964 创立 Steiner & Co。设计汇丰银行 HSBC 六边形 logo、渣打银行神话生物钞票、香港赛马会、香港置地、希尔顿香港。被誉为「香港平面设计之父」。AGI 资深会员。把东方符号融入西方现代主义平面设计的开创者。" },
  freemanlau: { zhName: "刘小康", title: "KL&K Design 联创 · 椅子先生", bio: "1958 生于香港。香港理工大学设计学院。1996 与靳埭强联合创立靳与刘设计 KL&K Design Consultants。「椅子戏」系列以椅子为载体的视觉艺术(2005-)走遍世界博物馆。设计中国人寿、屈臣氏蒸馏水瓶等品牌识别。香港艺术发展局视觉艺术主席多届。深圳市政府文化与设计顾问。「香港 → 中国大陆」设计跨界的代表人物之一。" },
  shidayu: { zhName: "石大宇", title: "台湾设计师 · 竹工艺现代化", bio: "1964 生于纽约,在台湾长大。Parsons School of Design 工业设计 BFA。1995 创立清庭 Clay Architecture(台北)。专注东方材料(尤其竹)的当代设计:「椅琴剑」系列、「云水居」竹凳、「天工开物」家具。Compasso d'Oro 金奖入围。德国 Red Dot 至尊奖、Good Design Award。台湾 + 大陆设计圈代表把东方传统材料语言带入国际工业设计的人物。" },
  lizhiqian: { zhName: "厉致谦", title: "3type(三言)创始人 · 中文字体新生代", bio: "独立中文字体设计师 + 字体史研究者。Type is Beautiful (TIB) 资深成员/作者。2014 创立上海 3type(三言)字体工作室,出版《西文字体的故事》《字模 1 号:汉字字体设计》等重要中文字体书籍。中国当代「字体研究 + 出版 + 实验」三位一体的代表新生代,推动汉字现代字体设计走向更专业化。" },
  yingyonghui: { zhName: "应永会", title: "古字体研究 + 民国铅字复刻", bio: "中国独立中文字体研究者 + 设计师。Type is Beautiful (TIB) 资深成员。专注复刻民国时期金属铅字、古代书法刻本字体,推出「方正民隶系列」「方正大颜楷」等复刻字体。把中国传统印刷文化与现代字库技术结合的独特路线代表。是中国字体研究领域少数能与朱志伟那一代字库元老对话的研究型设计师。" },
  lecorbusier: { zhName: "勒·柯布西耶", title: "现代主义建筑奠基人(1887-1965)", bio: "瑞士-法国建筑师。20 世纪最具影响力的建筑师。1923 著《走向新建筑》定义现代主义五原则:架空底层、屋顶花园、自由平面、横向长窗、自由立面。代表作:萨伏伊别墅(1931)、朗香教堂(1955)、马赛公寓(1952)、印度昌迪加尔规划。Modulor 人体比例系统创始人。" },
  flwright: { zhName: "弗兰克·劳埃德·赖特", title: "美国有机建筑创始人(1867-1959)", bio: "定义「有机建筑」——建筑应与环境融合。代表作:流水别墅(1935)、纽约古根海姆博物馆(1959)、罗比之家(1910)。Prairie Style 草原派开创者。AIA 金奖 1949。一生设计 1000+ 项目,完成 532 个。" },
  miesvanderrohe: { zhName: "密斯·凡·德罗", title: "包豪斯第三任校长 · 'less is more'", bio: "1886-1969。1930-1933 任包豪斯末任校长。1937 移民美国任 IIT 建筑系主任。代表作:巴塞罗那馆(1929)、范斯沃斯住宅(1951)、纽约西格拉姆大厦(1958)。「Less is more」「God is in the details」。" },
  waltergropius: { zhName: "瓦尔特·格罗皮乌斯", title: "包豪斯创始人(1883-1969)", bio: "1919 在魏玛创立包豪斯。1937 移民美国任 Harvard 建筑系主任(直至 1952),培养包括贝聿铭在内的整代美国建筑师。代表作:法古斯工厂(1911)、德绍包豪斯校舍(1925)、Pan Am 大厦(1963)。" },
  alvaraalto: { zhName: "阿尔瓦·阿尔托", title: "芬兰现代主义代表(1898-1976)", bio: "「人本主义现代主义」代表。代表作:帕米奥结核病疗养院(1933)、Villa Mairea(1939)、芬兰大厦(1971)。同时是家具设计先驱:Stool 60 凳子至今仍在生产。AIA 金奖 1963。芬兰 50 元钞票上的人物。" },
  louiskahn: { zhName: "路易·康", title: "美国当代建筑诗人(1901-1974)", bio: "现代主义晚期建筑诗人。代表作:Salk Institute(1965)、Kimbell Art Museum(1972)、孟加拉国会大厦(1982,死后完工)、Yale Center for British Art(1977)。强调材料 + 自然光 + 几何形体的诗意表达。AIA 金奖 1971。" },
  impei: { zhName: "贝聿铭", title: "现代主义大师 · Pritzker 1983", bio: "1917 生于广州,2019 去世。MIT + Harvard(师从 Walter Gropius)。1955 创办 I.M. Pei & Partners。Pritzker Prize 1983。代表作:JFK 总统图书馆、华盛顿国家美术馆东馆、香港中银大厦(1990)、罗浮宫玻璃金字塔(1989)、苏州博物馆(2006)、多哈伊斯兰艺术博物馆(2008)。把现代主义带到全球公共建筑的代表。" },
  frankgehry: { zhName: "弗兰克·盖里", title: "解构主义代表 · Pritzker 1989", bio: "1929 生于多伦多。代表作:毕尔巴鄂古根海姆(1997,改变了一座城市)、洛杉矶迪士尼音乐厅(2003)、布拉格跳舞房子(1996)、巴黎路易威登基金会(2014)、纽约 8 Spruce Street(2011)。把数字 3D 建模(CATIA)用于复杂曲面建筑的先驱。「毕尔巴鄂效应」代名词。" },
  zahahadid: { zhName: "扎哈·哈迪德", title: "参数化建筑女王 · Pritzker 2004(首位女性)", bio: "1950 生于巴格达,2016 去世。AA 师从 Rem Koolhaas。1980 创立 Zaha Hadid Architects。代表作:Vitra 消防站(1993)、罗马 MAXXI(2010)、伦敦奥运水上中心(2012)、巴库阿利耶夫中心(2012)、北京大兴机场(联合设计 2019)。开创参数化建筑流派。" },
  remkoolhaas: { zhName: "雷姆·库哈斯", title: "OMA 创始人 · Pritzker 2000 · 央视大楼", bio: "1944 生于鹿特丹。前荷兰电视台记者+剧作家。1975 联创 OMA。代表作:西雅图中央图书馆(2004)、北京央视大楼(2012)、波尔图音乐之家(2005)、米兰 Prada 基金会(2018)。理论著作《狂癫纽约》(1978)、《S, M, L, XL》(1995)。Harvard 教授,培养 Bjarke Ingels 等下一代。" },
  normanfoster: { zhName: "诺曼·福斯特", title: "High-Tech 建筑代表 · Pritzker 1999", bio: "1935 生于曼彻斯特。Yale(与 Richard Rogers 同学)。1967 创立 Foster + Partners。代表作:汇丰香港(1985)、香港国际机场(1998)、伦敦小黄瓜(2003)、Apple Park(2017,与 Jony Ive 合作)、柏林国会大厦穹顶(1999)。代表 High-Tech 建筑流派。终身贵族。" },
  renzopiano: { zhName: "伦佐·皮亚诺", title: "意大利建筑师 · Pritzker 1998", bio: "1937 生于热那亚。1971 与 Richard Rogers 合作设计巴黎蓬皮杜中心(1977)。1981 创办 Renzo Piano Building Workshop。代表作:蓬皮杜中心(1977)、关西国际机场(1994)、伦敦碎片大厦(2012,西欧最高)、纽约 Whitney 博物馆(2015)、雅典 Stavros Niarchos 文化中心(2016)。" },
  jeannouvel: { zhName: "让·努维尔", title: "法国当代建筑 · Pritzker 2008", bio: "1945 生于法国。Beaux-Arts Paris。1981 创立 Ateliers Jean Nouvel。代表作:巴黎阿拉伯世界研究中心(1987)、巴塞罗那 Torre Agbar(2005)、巴黎 Quai Branly 博物馆(2006)、阿布扎比卢浮宫(2017)、巴黎爱乐厅(2015)、卡塔尔国家博物馆(2019)。把当地文化符号融入现代建筑。" },
  tadaoando: { zhName: "安藤忠雄", title: "清水混凝土代表 · Pritzker 1995", bio: "1941 生于大阪。前职业拳击手,自学建筑(无正式学位)。1969 创办事务所。代表作:光之教堂(1989)、淡路梦舞台(2000)、上海保利大剧院(2014)、威尼斯 Punta della Dogana(2009)。「清水混凝土 + 几何 + 自然光」三位一体的禅意建筑语言。日本文化勋章。" },
  toyoito: { zhName: "伊东丰雄", title: "日本建筑师 · Pritzker 2013", bio: "1941 生于韩国京城(日本籍),东京大学建筑系。1971 创立工作室。代表作:仙台媒体中心(2001)、多摩美术大学图书馆(2007)、台中歌剧院(2016)。培养 Kazuyo Sejima(SANAA)等下一代日本建筑师。代表「轻盈建筑」与有机曲面探索。" },
  kazuyosejima: { zhName: "妹岛和世", title: "SANAA 联创 · Pritzker 2010", bio: "1956 生于茨城县,日本女建筑师。日本女子大学(师从伊东丰雄事务所)。1995 与 Ryue Nishizawa 创立 SANAA。代表作:Christian Dior 表参道店(2003)、金泽 21 世纪美术馆(2004)、纽约 New Museum(2007)、Rolex Learning Center(2010)、卢浮宫朗斯分馆(2012)。极致透明、白色、流动平面的极简建筑代表。" },
  shigeruban: { zhName: "坂茂", title: "纸建筑 · Pritzker 2014", bio: "1957 生于东京。Cooper Union 建筑学位。1985 创办坂茂建筑设计事务所。开创「纸管建筑」——用纸管作为结构性材料,主要应用于人道主义建筑(灾后避难所)。代表作:梅斯蓬皮杜中心(2010)、Aspen 美术馆(2014)、克赖斯特彻奇纸教堂(2013,新西兰地震后)。Voluntary Architects' Network(VAN)创办人。" },
  aratisozaki: { zhName: "矶崎新", title: "日本后现代建筑 · Pritzker 2019", bio: "1931 生于大分县,2022 去世。东京大学(师从丹下健三)。1963 创立工作室。代表作:筑波中心(1983)、洛杉矶 MOCA(1986)、巴塞罗那奥运体育馆 Palau Sant Jordi(1992)、上海喜马拉雅中心(2010)。日本最具国际经验的后现代主义建筑师,把日本建筑师推向世界舞台的关键人物。" },
  herzogdemeuron: { zhName: "赫尔佐格 + 德默隆", title: "瑞士双人组合 · Pritzker 2001 · 鸟巢联合设计", bio: "Jacques Herzog + Pierre de Meuron 瑞士建筑师双人组合,1978 在巴塞尔联创。代表作:伦敦泰特现代美术馆(2000)、北京鸟巢(2008,与艾未未 + 李兴钢合作)、慕尼黑安联球场(2005)、SF de Young 博物馆(2005)、汉堡易北爱乐厅(2017)。把材料表面、纹理、立面作为建筑表达核心。" },
  santiagocalatrava: { zhName: "圣地亚哥·卡拉特拉瓦", title: "建筑师 + 工程师 · 桥梁建筑大师", bio: "1951 生于西班牙瓦伦西亚。瓦伦西亚理工 + ETH Zürich 工程博士。同时持有建筑师 + 工程师执照。代表作:瓦伦西亚艺术与科学城(1998)、瑞典扭转大厦(2005)、特内里费音乐厅(2003)、纽约 WTC 交通枢纽 Oculus(2016)、列日火车站(2009)。把生物形态(骨骼/翅膀)与工程结构融合的代表。" },
  bjarkeingels: { zhName: "比亚克·英厄尔斯", title: "BIG 创始人 · 丹麦新生代建筑师", bio: "1974 生于哥本哈根。曾在 Rem Koolhaas 的 OMA 工作。2005 创立 BIG(Bjarke Ingels Group)。代表作:山型公寓(2008)、8 House(2010)、纽约 Via 57 West(2016)、CopenHill 滑雪场+垃圾发电厂(2019)、乐高之家(2017)、Google Bay View(2022)。代表「享乐式可持续设计」新一代建筑哲学。Time 100 最具影响力人物 2016。" },
  peterzumthor: { zhName: "彼得·卒姆托", title: "极简材料诗人 · Pritzker 2009", bio: "1943 生于瑞士巴塞尔。1979 在瑞士 Haldenstein 山区创立工作室,至今仅 30 余项目(刻意控制规模)。代表作:瓦尔斯温泉(1996)、布雷根茨美术馆(1997)、科隆科伦巴博物馆(2007)、瑞士圣本笃教堂(1988)、德国 Bruder Klaus 田野教堂(2007)。最坚持「场所精神」的当代建筑诗人。" },
  wangshu: { zhName: "王澍", title: "中国首位 Pritzker 2012 · 象山校区", bio: "1963 生于乌鲁木齐。东南大学建筑学士 + 同济大学博士。1997 与陆文宇创立「业余建筑工作室」(杭州)。中国美术学院建筑艺术学院院长。Pritzker Prize 2012(首位获奖中国建筑师)。代表作:中国美院象山校区(2007/2013)、宁波博物馆(2008)、富阳博物馆(2016)、文村乡村重建。象山校区使用 700 万片回收砖瓦,定义中国当代「向传统、向乡土」建筑路径。" },
  liujiakun: { zhName: "刘家琨", title: "Pritzker 2025 · 西村大院", bio: "1956 生于成都。重庆建筑工程学院(今重庆大学)毕业。1999 创办家琨建筑设计事务所。Pritzker Prize 2025(中国第二位获奖建筑师)。代表作:西村大院(成都 2015)、鹿野苑石刻艺术博物馆(2002)、Novartis 上海办公园区。「再生砖」项目(2008 汶川地震后,把废墟材料做成强度更高的砖块)。" },
  yunghochang: { zhName: "张永和", title: "非常建筑创办人 · 中国实验建筑先驱", bio: "1956 生于北京(梁思成的学生张开济之子)。东南大学 + UC Berkeley 硕士。1993 创办「非常建筑」(Atelier FCJZ),中国大陆第一家私人建筑事务所。2005-2010 任 MIT 建筑系主任(华人首位)。Pritzker 评委(2012-2017)。代表作:深圳山雨村、二分宅(2002)、深圳万科中心(2009)、垂直玻璃宅(2013)。中国当代「实验建筑」运动先驱。" },
  mayansong: { zhName: "马岩松", title: "MAD 创办人 · 中国新生代", bio: "1975 生于北京。北京建筑工程学院 + Yale Master of Architecture。曾在 Zaha Hadid 伦敦工作。2004 创办 MAD Architects(北京)。代表作:加拿大 Mississauga 梦露大厦(2012)、哈尔滨大剧院(2015)、洛杉矶卢卡斯叙事艺术博物馆(2025)、衢州体育场(2023)、朝阳公园广场(2017)。代表中国建筑师在国际舞台的新生代。" },
  lixinggang: { zhName: "李兴钢", title: "鸟巢中方主设计师", bio: "1969 生于河北。天津大学建筑系。中国建筑设计研究院总建筑师 + 李兴钢工作室。北京 2008 奥运会鸟巢国家体育场中方设计主持人(与 Herzog & de Meuron + 艾未未合作)。2022 北京冬奥延庆赛区国家雪车雪橇中心、国家高山滑雪中心总设计师。代表作:鸟巢(2008)、绩溪博物馆(2014)、瞬时桃花源、北京冬奥延庆赛区(2022)。" },
  zhupei: { zhName: "朱锫", title: "当代美术馆建筑代表 · 央美建筑学院院长", bio: "1962 生于北京。清华建筑学士 + Berkeley 硕士。曾任 Richard Meier & Partners(纽约)。2005 创办朱锫建筑事务所。中央美术学院建筑学院院长(2018-)。代表作:OCT 设计博物馆(深圳 2011)、上海喜马拉雅中心(与矶崎新合作)、寿县文化艺术中心(2019)、景德镇御窑博物馆(2020,获 RIBA International Prize 提名)、岩茶博物馆。" },
  donggong: { zhName: "董功", title: "直向建筑创始人", bio: "1972 生于北京。清华建筑学士 + UIUC 硕士。曾任 Richard Meier & Partners、Steven Holl Architects。2008 创办直向建筑(北京)。代表作:阿那亚海边图书馆(秦皇岛 2015,「孤独的图书馆」网红建筑)、阿那亚海边教堂(2015)、长江美术馆(太原 2019)、宁海十里红妆博物馆(2020)。把简约现代主义与中国当代生活场景结合。" },
  liuyichun: { zhName: "柳亦春", title: "大舍建筑创始人 · 龙美术馆西岸馆", bio: "1969 生于山东。同济大学建筑系。2001 与陈屹峰、庄慎共同创办大舍建筑(上海)。代表作:龙美术馆西岸馆(上海 2014,「伞拱」混凝土结构最具代表性的当代中国美术馆建筑)、艺仓美术馆(2016)、嘉定新城规划展示馆。把工业建筑、混凝土材料、上海地域性融合的代表。多次代表中国参加威尼斯建筑双年展。" },
  yasuokuroki: { zhName: "黑木靖夫", title: "Sony Walkman 主设计 + Sony logo", bio: "日本工业设计师 + 工程师(?-2007)。Sony Design Center 创始团队。1979 年响应 Sony 联合创始人井深大「想在飞机上听音乐」的请求,把 Sony Pressman 录音机改造成 Walkman TPS-L2,被誉为「Mr. Walkman」。同时是 Sony logo 早期设计的主导者之一。" },
  dancederholm: { zhName: "Dan Cederholm", title: "Dribbble 联合创始人 + SimpleBits 创办人", bio: "美国设计师 + 作家。2002 创立 SimpleBits。2009 与 Rich Thornett 联创 Dribbble——全球最大设计师作品分享社区,影响整个一代 web/UI 设计师的 shot 文化。著作 CSS3 For Web Designers、Bulletproof Web Design、Handcrafted CSS。代表 Web 标准 + Web design 黄金时代的领军人物。" },
  sebastiaandewith: { zhName: "Sebastiaan de With", title: "Halide 联创 · 2026 回归苹果设计团队", bio: "荷兰 UI/HI 设计师。早期在苹果设计 iCloud / MobileMe / Find My。后联创 Lux Optics 推出 iOS 专业相机 app Halide(屡获 Apple Design Award)、Kino、Spectre。Halide 被视为 iOS 独立工作室设计黄金标杆。2026.1 重回苹果设计团队。" },
  markotto: { zhName: "Mark Otto(mdo)", title: "Bootstrap 联创 · GitHub Primer 设计系统", bio: "2010 在 Twitter 与 Jacob Thornton 联创 Bootstrap CSS 框架——GitHub star 最多的开源项目之一,定义了 2010s web design 视觉语言。2014 加入 GitHub 任 Design Manager,主导 GitHub Primer 设计系统。Twitter / Dribbble 上以 @mdo 著称。" },
  jessicahische: { zhName: "Jessica Hische", title: "Lettering 设计明星 · Daily Drop Cap", bio: "美国 lettering 设计师。2009 启动 Daily Drop Cap 项目——365 天每天画一个装饰性首字母,在 Dribbble 圈成为 lettering 复兴的标志性事件。客户:Apple、Wes Anderson 电影片头、Tiffany & Co、Penguin。著作《In Progress》(2015)。" },
  khoivinh: { zhName: "Khoi Vinh", title: "Adobe Behance Director · 前 NYT 设计总监", bio: "越南裔美国设计师。Otis College。前《The New York Times》数字设计总监(2006-2010),主导 NYT 数字版重设计。2013 加入 Adobe,现任 Adobe Brand & Communication Design Director,负责 Behance 等创意平台。Subtraction.com 博客自 2000 年代起被设计师圈广泛阅读。" },
  matthewcarter: { zhName: "Matthew Carter", title: "Verdana / Georgia 字体设计师", bio: "1937 生于伦敦。20 世纪后半叶最重要的字体设计师之一。代表作:Verdana(1996,微软,屏幕阅读优化)、Georgia(1996,微软,屏幕衬线标准)、Tahoma、Bell Centennial、Big Caslon。AIGA Medal 1995。MacArthur Genius Fellow 2010。把字体设计从印刷时代成功带入数字屏幕时代的关键人物。" },
  adrianfrutiger: { zhName: "Adrian Frutiger", title: "Frutiger / Univers 字体设计师", bio: "1928 生于瑞士,2015 去世。瑞士字体设计师,20 世纪西文字体大师之一。代表作:Univers(1957,21 个字重的统一字体家族)、Frutiger(1976,巴黎戴高乐机场标识字体)、Avenir(1988)、Méridien、Apollo。瑞士国际主义字体哲学落地的核心人物。" },
  jonathanhoefler: { zhName: "Jonathan Hoefler", title: "Hoefler & Frere-Jones 联创 · Gotham 字体", bio: "1970 生于纽约。自学字体设计。1989 创立 Hoefler Type Foundry。1999 与 Tobias Frere-Jones 联合成立 Hoefler & Frere-Jones,成为 21 世纪初最有影响力的字体公司。代表字体:Gotham(2000,奥巴马 2008 竞选)、Mercury、Sentinel、Archer、Whitney。2014 与 Frere-Jones 公开决裂分家。2021 卖给 Monotype。" },
  tobiasfrerejones: { zhName: "Tobias Frere-Jones", title: "字体大师 · 前 Hoefler & Frere-Jones 联创", bio: "1970 生于纽约(Hoefler 同年)。RISD 平面设计 BFA。1990s 在 Font Bureau 设计 Whitney、Interstate、Poynter Old Style。1999 与 Hoefler 联创 H&FJ 14 年,2014 公开分家。2015 创办 Frere-Jones Type 独立工作室。Yale 平面设计研究生院教授。" },
  jesperkouthoofd: { zhName: "Jesper Kouthoofd", title: "Teenage Engineering 联创 + CEO + 创意总监", bio: "瑞典设计师 + 工程师。2005 与 David Eriksson、Jens Rudberg、Erik Lundstedt 在斯德哥尔摩联创 Teenage Engineering 任 CEO + 创意总监。OP-1(2011)合成器开创独立电子乐器市场,售价 1199 美金但成为乐迷信仰物。后续 Pocket Operator 系列、IKEA Frekvens 联名(2019)、Panic Playdate 黄色游戏机硬件设计、Nothing CMF 合作、Rabbit R1 工业设计(2024)。把硬件玩具感、北欧理性、合成器文化融为一体。" }
};

function applyLanguage(lang) {
  currentLang = lang;
  const t = i18n[lang];

  // Nav
  document.querySelector(".nav-title").textContent = t.navTitle;
  document.getElementById("search-input").placeholder = t.searchPlaceholder;
  document.getElementById("nav-stats").textContent = t.stats(scholars.length, connections.length);

  // Filter pills
  const pillMap = { all: t.filterAll, industrial: t.filterIndustrial, graphic: t.filterGraphic, ux: t.filterUX, typography: t.filterType, chinese: t.filterChinese, architect: t.filterArchitect };
  document.querySelectorAll(".filter-pill").forEach(btn => {
    btn.textContent = pillMap[btn.dataset.filter] || btn.textContent;
  });

  // Legend
  const legendLabels = document.querySelectorAll("#legend .legend-label");
  const legendTexts = [t.legendApple, t.legendBraun, t.legendMUJI, t.legendPentagram, t.legendChinese, t.legendStartup, t.legendCofounder, t.legendCoauthor, t.legendAdvisor, t.legendColleague];
  legendLabels.forEach((el, i) => { if (legendTexts[i]) el.textContent = legendTexts[i]; });

  const legendHeadings = document.querySelectorAll("#legend .legend-heading");
  if (legendHeadings[0]) legendHeadings[0].textContent = t.legendOrgs;
  if (legendHeadings[1]) legendHeadings[1].textContent = t.legendConns;

  // Detail panel section titles
  const sectionTitles = document.querySelectorAll(".detail-section-title");
  if (sectionTitles[0]) sectionTitles[0].textContent = t.sectionAbout;
  if (sectionTitles[1]) sectionTitles[1].textContent = t.sectionPapers;
  if (sectionTitles[2]) sectionTitles[2].textContent = t.sectionConnections;

  // Keyboard hints
  const hints = document.querySelectorAll(".hint-item");
  const hintTexts = [t.hintZoom, t.hintPan, t.hintDetails, t.hintClose];
  hints.forEach((el, i) => {
    const key = el.querySelector(".hint-key");
    if (key && hintTexts[i]) {
      el.innerHTML = "";
      el.appendChild(key);
      el.append(" " + hintTexts[i]);
    }
  });

  // Update graph node labels with Chinese names
  nodeGroups.selectAll(".node-name-label").text(d => {
    const zhData = scholarZh[d.id];
    if (lang === "zh" && zhData && zhData.zhName) return zhData.zhName;
    return d.name;
  });

  // If detail panel is open, refresh it
  if (document.getElementById("detail-panel").classList.contains("open") && window._currentDetailScholar) {
    openDetail(window._currentDetailScholar);
  }

  // Toggle buttons
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
}

// Photo cache
const photoCache = {};

async function fetchPhoto(scholarId) {
  if (photoCache[scholarId]) return photoCache[scholarId];
  // 1) 英文 Wikipedia
  const enWiki = wikiTitles[scholarId];
  if (enWiki) {
    try {
      const resp = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(enWiki)}`);
      if (resp.ok) {
        const data = await resp.json();
        const url = data.thumbnail?.source;
        if (url) { photoCache[scholarId] = url; return url; }
      }
    } catch(e) {}
  }
  // 2) 中文 Wikipedia(中国本土人物)
  const zhWiki = zhWikiTitles[scholarId];
  if (zhWiki) {
    try {
      const resp = await fetch(`https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(zhWiki)}`);
      if (resp.ok) {
        const data = await resp.json();
        const url = data.thumbnail?.source;
        if (url) { photoCache[scholarId] = url; return url; }
      }
    } catch(e) {}
  }
  // 3) Twitter avatar via unavatar.io(无 Wikipedia 但活跃在 X 的 AI 大佬)
  const tw = twitterHandles[scholarId];
  if (tw) {
    const url = `https://unavatar.io/twitter/${tw}?fallback=false`;
    const ok = await new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
    if (ok) { photoCache[scholarId] = url; return url; }
  }
  // 4) 终极兜底:ui-avatars 生成彩色 monogram(每人 deterministic 颜色)
  const scholar = scholars.find(s => s.id === scholarId);
  if (scholar) {
    const colors = ['0a84ff','30d158','ff375f','ff9f0a','5e5ce6','bf5af2','64d2ff','ffd60a','ff9500','32d74b'];
    const hash = scholarId.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const bg = colors[hash % colors.length];
    const url = `https://ui-avatars.com/api/?name=${encodeURIComponent(scholar.name)}&background=${bg}&color=fff&size=200&bold=true&font-size=0.4`;
    photoCache[scholarId] = url;
    return url;
  }
  return null;
}

// openDetail with i18n support
function openDetail(d) {
  const panel = document.getElementById("detail-panel");
  panel.classList.add("open");
  window._currentDetailScholar = d;

  // Avatar — always reset to placeholder first
  const initials = d.name.split(" ").map(w => w[0]).join("").slice(0, 2);
  const oldAvatar = document.getElementById("detail-avatar");
  const placeholder = document.createElement("div");
  placeholder.className = "detail-avatar-placeholder";
  placeholder.id = "detail-avatar";
  placeholder.innerHTML = `<span>${initials}</span>`;
  oldAvatar.replaceWith(placeholder);

  // Load photo
  const currentId = d.id;
  if (photoCache[d.id]) {
    const img = document.createElement("img");
    img.className = "detail-avatar";
    img.id = "detail-avatar";
    img.alt = d.name;
    img.src = photoCache[d.id];
    placeholder.replaceWith(img);
  } else {
    fetchPhoto(d.id).then(url => {
      // Only update if panel still shows same person
      const nameEl = document.getElementById("detail-name");
      if (!nameEl || nameEl.textContent !== d.name) return;
      const el = document.getElementById("detail-avatar");
      if (el && url) {
        const img = document.createElement("img");
        img.className = "detail-avatar";
        img.id = "detail-avatar";
        img.alt = d.name;
        img.src = url;
        el.replaceWith(img);
      }
    });
  }

  const t = i18n[currentLang];
  const zh = scholarZh[d.id];
  const displayName = (currentLang === "zh" && zh && zh.zhName) ? zh.zhName + "  " + d.name : d.name;

  document.getElementById("detail-name").textContent = displayName;

  if (currentLang === "zh" && zh) {
    document.getElementById("detail-title").textContent = zh.title;
    document.getElementById("detail-bio").textContent = zh.bio;
  } else {
    document.getElementById("detail-title").textContent = d.title;
    document.getElementById("detail-bio").textContent = d.bio;
  }

  const orgEl = document.getElementById("detail-org");
  const c = getColor(d.org);
  orgEl.textContent = d.org;
  orgEl.style.background = c + "18";
  orgEl.style.color = c;
  orgEl.style.border = `0.5px solid ${c}32`;

  // Papers
  const papersEl = document.getElementById("detail-papers");
  const papersSection = document.getElementById("detail-papers-section");
  if (d.papers && d.papers.length) {
    papersSection.style.display = "block";
    papersEl.innerHTML = d.papers.map(p => {
      const title = p.url ? `<a class="paper-link" href="${p.url}" target="_blank" rel="noopener">${p.t}</a>` : `<span class="paper-title">${p.t}</span>`;
      return `<div class="paper-entry"><span class="paper-year">${p.y}</span>${title}</div>`;
    }).join("");
  } else {
    papersSection.style.display = "none";
  }

  // Section titles
  const sectionTitles = document.querySelectorAll(".detail-section-title");
  if (sectionTitles[0]) sectionTitles[0].textContent = t.sectionAbout;
  if (sectionTitles[1]) sectionTitles[1].textContent = t.sectionPapers;
  if (sectionTitles[2]) sectionTitles[2].textContent = t.sectionConnections;

  // Connections
  const connsEl = document.getElementById("detail-connections");
  const related = connections.filter(c => {
    const s = typeof c.source === 'object' ? c.source.id : c.source;
    const tt = typeof c.target === 'object' ? c.target.id : c.target;
    return s === d.id || tt === d.id;
  });
  connsEl.innerHTML = related.map(c => {
    const s = typeof c.source === 'object' ? c.source.id : c.source;
    const tt = typeof c.target === 'object' ? c.target.id : c.target;
    const oid = s === d.id ? tt : s;
    const o = scholars.find(sc => sc.id === oid);
    if (!o) return '';
    const label = currentLang === "zh" ? (connLabelZh[c.label] || c.label) : c.label;
    const typeBadge = t.typeLabels[c.type];
    return `<div class="conn-entry" data-id="${o.id}">
      <div class="conn-dot" style="background:${getColor(o.org)}"></div>
      <div class="conn-info"><div class="conn-name">${(currentLang === "zh" && scholarZh[o.id] && scholarZh[o.id].zhName) ? scholarZh[o.id].zhName + "  " + o.name : o.name}</div><div class="conn-relation">${label}</div></div>
      <span class="conn-type-badge">${typeBadge}</span>
    </div>`;
  }).join("");

  connsEl.querySelectorAll(".conn-entry").forEach(el => {
    el.addEventListener("click", () => {
      const target = scholars.find(s => s.id === el.dataset.id);
      if (target) {
        openDetail(target);
        const tr = d3.zoomTransform(svg.node());
        svg.transition().duration(600).ease(d3.easeCubicInOut).call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(W / 2 - target.x * tr.k, H / 2 - target.y * tr.k).scale(tr.k)
        );
      }
    });
  });
};

function renderGeoMap() {
  const svg = document.getElementById("geo-svg");
  if (!svg) return;
  const counts = {};
  Object.values(cityMap).forEach(city => { counts[city] = (counts[city] || 0) + 1; });

  // Simplified world landmasses
  let html = '';
  // North America
  html += '<path class="geo-outline" d="M15,15 L75,12 L80,25 L85,45 L75,60 L60,70 L40,65 L25,55 L15,40 Z"/>';
  // Europe
  html += '<path class="geo-outline" d="M120,18 L150,15 L155,30 L148,42 L135,45 L122,40 L118,28 Z"/>';
  // Asia
  html += '<path class="geo-outline" d="M155,25 L200,20 L240,25 L260,35 L255,55 L240,70 L220,75 L200,72 L180,65 L165,55 L158,42 Z"/>';
  // Japan
  html += '<path class="geo-outline" d="M248,40 L255,38 L258,48 L252,55 L248,48 Z"/>';

  Object.entries(geoPositions).forEach(([city, pos]) => {
    const count = counts[city] || 0;
    if (count === 0) return;
    const r = Math.max(Math.min(Math.sqrt(count) * 4.5, 20), 5);
    html += `<circle class="geo-bubble" cx="${pos.x}" cy="${pos.y}" r="${r}"/>`;
    html += `<text class="geo-count" x="${pos.x}" y="${pos.y + 2.5}">${count}</text>`;
    const labelY = pos.y + r + 8;
    const label = currentLang === "zh" ? pos.label : pos.labelEn;
    html += `<text class="geo-label" x="${pos.x}" y="${labelY}">${label}</text>`;
  });

  svg.innerHTML = html;
  const heading = document.getElementById("geo-heading");
  if (heading) heading.textContent = currentLang === "zh" ? "学者地域分布" : "Location Distribution";
}
