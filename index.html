/* ===== Apple Design System Foundation ===== */
@font-face {
  font-family: 'SF Pro Display';
  src: local('SF Pro Display'), local('.SFNSDisplay'), local('SFProDisplay-Regular'),
       local('Helvetica Neue'), local('Helvetica');
  font-weight: 100 900;
}
@font-face {
  font-family: 'SF Pro Text';
  src: local('SF Pro Text'), local('.SFNSText'), local('SFProText-Regular'),
       local('Helvetica Neue'), local('Helvetica');
  font-weight: 100 900;
}

:root {
  /* Apple Colors */
  --apple-black: #000000;
  --apple-white: #ffffff;
  --apple-gray-bg: #f5f5f7;
  --apple-near-black: #1d1d1f;
  --apple-blue: #0071e3;
  --apple-link-blue: #0066cc;
  --apple-link-blue-dark: #2997ff;
  --apple-text-secondary: rgba(255, 255, 255, 0.56);
  --apple-text-tertiary: rgba(255, 255, 255, 0.32);
  --apple-surface-dark-1: #161617;
  --apple-surface-dark-2: #1c1c1e;
  --apple-surface-dark-3: #2c2c2e;

  /* Organization Colors — desaturated, Apple-refined */
  --org-deepmind: #64d2ff;
  --org-openai: #30d158;
  --org-anthropic: #ff6482;
  --org-meta: #5e9eff;
  --org-stanford: #ff9f0a;
  --org-university: #bf5af2;
  --org-startup: #ffd60a;
  --org-independent: #98989d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--apple-black);
  color: var(--apple-white);
  font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
  min-height: 100vh;
  width: 100vw;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Navigation — Apple Glass ===== */
#nav-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
  border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
}
.nav-title {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.374px;
  color: var(--apple-white);
  white-space: nowrap;
}
.nav-separator {
  width: 0.5px;
  height: 20px;
  background: rgba(255, 255, 255, 0.16);
  margin: 0 16px;
}
.nav-stats {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: -0.12px;
  color: var(--apple-text-secondary);
  white-space: nowrap;
  flex-shrink: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  max-width: 240px;
}

/* Search — Apple Style */
.nav-search-wrapper {
  margin-left: 16px;
  position: relative;
  flex-shrink: 1;
  min-width: 120px;
}
#search-input {
  width: 180px;
  height: 32px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  border-radius: 8px;
  color: var(--apple-white);
  padding: 0 12px 0 32px;
  font-family: 'SF Pro Text', -apple-system, sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.224px;
  outline: none;
  transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}
#search-input::placeholder {
  color: rgba(255, 255, 255, 0.32);
}
#search-input:focus {
  width: 280px;
  background: rgba(255, 255, 255, 0.15);
  box-shadow: 0 0 0 2px var(--apple-blue);
}
.search-icon {
  position: absolute;

  top: 50%;

  pointer-events: none;
}

/* Filter Pills — Apple Pill CTA */
.filter-group {
  display: flex;
  gap: 6px;
  margin-left: 16px;
  flex-shrink: 1;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.filter-pill {
  padding: 5px 14px;
  border-radius: 980px;
  font-family: 'SF Pro Text', -apple-system, sans-serif;
  font-size: 12px;

  line-height: 1.33;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: transparent;
  color: rgba(255, 255, 255, 0.56);
  transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
  white-space: nowrap;
}
.filter-pill:hover {
  border-color: rgba(255, 255, 255, 0.32);
  color: rgba(255, 255, 255, 0.8);
}
.filter-pill.active {
  background: var(--apple-blue);
  border-color: var(--apple-blue);
  color: var(--apple-white);
}
.nav-spacer { flex: 1; }

/* Language Toggle — Apple Segmented Control */
.lang-toggle {
  display: flex;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  padding: 2px;
  gap: 0;
  margin-left: 12px;
}
.lang-btn {
  padding: 4px 12px;
  border-radius: 6px;
  font-family: 'SF Pro Text', -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.12px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.4);
  transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
  white-space: nowrap;
}
.lang-btn:hover {
  color: rgba(255, 255, 255, 0.64);
}
.lang-btn.active {
  background: rgba(255, 255, 255, 0.12);
  color: var(--apple-white);
}

/* ===== Graph Canvas ===== */
#graph-container {

}
body.no-insights #graph-container {

}
#graph-container svg {
  width: 100%;

}

#legend {
  position: fixed;
  bottom: 140px;
  left: 24px;
  z-index: 100;

}
.legend-card {
  background: rgba(28, 28, 30, 0.88);

}
.legend-heading {

.legend-row {

.legend-line-sample {
  width: 16px;
  height: 0;

.legend-label {
  font-size: 12px;
  font-weight: 400;

  color: rgba(255, 255, 255, 0.56);
}

/* ===== Detail Panel — Apple Sidebar ===== */
#detail-panel {
  position: fixed;
  top: 48px;
  right: 0;
  width: 380px;
  height: calc(100vh - 48px);
  background: var(--apple-surface-dark-1);
  border-left: 0.5px solid rgba(255, 255, 255, 0.08);
  z-index: 500;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
  overflow-y: auto;
  overflow-x: hidden;
}
#detail-panel.open {
  transform: translateX(0);
}
#detail-panel::-webkit-scrollbar { width: 0; }

.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: rgba(255, 255, 255, 0.56);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  z-index: 1;
}
.detail-close:hover {
  background: rgba(255, 255, 255, 0.2);
}

.detail-header {
  padding: 40px 24px 20px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.detail-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(255, 255, 255, 0.08);
}
.detail-avatar.loading {
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%);
  background-size: 200% 200%;
  animation: shimmer 1.5s ease infinite;
}
@keyframes shimmer {
  0% { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}
.detail-avatar-placeholder {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.2);
  font-family: 'SF Pro Display', -apple-system, sans-serif;
}
.detail-header-info {
  flex: 1;
  min-width: 0;
}
.detail-name {
  font-family: 'SF Pro Display', -apple-system, sans-serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.196px;
  line-height: 1.14;
  color: var(--apple-white);
  margin-bottom: 6px;
}
.detail-title {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.224px;
  line-height: 1.43;
  color: var(--apple-text-secondary);
}
.detail-org-badge {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 12px;
  border-radius: 980px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.12px;
}

.detail-section {
  padding: 20px 24px;
  border-top: 0.5px solid rgba(255, 255, 255, 0.06);
}
.detail-section-title {
  font-family: 'SF Pro Text', -apple-system, sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--apple-text-tertiary);
  margin-bottom: 12px;
}
.detail-section p {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.224px;
  line-height: 1.5;

}

/* Paper items */
.paper-entry {
  padding: 8px 0;
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.paper-year {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.12px;
  color: var(--apple-link-blue-dark);
  flex-shrink: 0;
  min-width: 36px;
}
.paper-title {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: -0.12px;
  line-height: 1.38;
  color: rgba(255, 255, 255, 0.64);
}
.paper-link {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: -0.12px;
  line-height: 1.38;
  color: var(--apple-link-blue-dark);
  text-decoration: none;
  transition: color 0.2s;
}
.paper-link:hover {
  color: var(--apple-white);
  text-decoration: underline;
}

/* Connection items */
.conn-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  cursor: pointer;
  border-radius: 8px;
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
  transition: background 0.2s;
}
.conn-entry:hover {
  background: rgba(255, 255, 255, 0.04);
}
.conn-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.conn-info {
  flex: 1;
  min-width: 0;
}
.conn-name {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.224px;
  color: var(--apple-white);
}
.conn-relation {
  font-size: 11px;
  letter-spacing: -0.08px;
  color: var(--apple-text-tertiary);
  margin-top: 1px;
}
.conn-type-badge {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: -0.08px;
  color: var(--apple-text-tertiary);
  padding: 2px 8px;
  border-radius: 980px;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  flex-shrink: 0;
}

/* ===== SVG Styles ===== */

/* Links — 4 tiers of visual weight */
.link-line {
  transition: stroke-opacity 0.35s ease, stroke-width 0.35s ease;
  stroke-linecap: round;
}
/* Cofounder: strongest bond, solid bright green */
.link-line.type-cofounder {
  stroke: #30d158;
  stroke-width: 2.5;
  stroke-opacity: 0.5;
}
/* Coauthor: strong academic tie, solid blue */
.link-line.type-coauthor {
  stroke: #2997ff;
  stroke-width: 1.8;
  stroke-opacity: 0.35;
}
/* Advisor: mentor line, dashed cyan */
.link-line.type-advisor {
  stroke: #64d2ff;
  stroke-width: 1.8;
  stroke-opacity: 0.4;
  stroke-dasharray: 8 5;
}
/* Colleague: 真同事(同公司同期共事过) */
.link-line.type-colleague {
  stroke: rgba(255, 255, 255, 0.5);
  stroke-width: 0.8;
  stroke-opacity: 0.18;
  stroke-dasharray: 2 6;
}

.node-group {
  transition: opacity 0.3s ease;
}
.node-glow {
  transition: opacity 0.3s ease;
}
.node-label {
  font-family: 'SF Pro Text', -apple-system, sans-serif;
  font-weight: 500;
  fill: rgba(255, 255, 255, 0.64);
  text-anchor: middle;
  pointer-events: none;
  transition: fill 0.3s, font-size 0.3s;
}

/* Dim / Highlight states */
.node-group.dimmed { opacity: 0.06; }
.node-group.highlighted { opacity: 1; }
.node-group.highlighted .node-label {
  fill: var(--apple-white);
  font-weight: 600;
}
.node-group.highlighted .node-glow { opacity: 0.5; }

.link-line.dimmed { stroke-opacity: 0.015 !important; }
.link-line.highlighted.type-cofounder { stroke-opacity: 0.85 !important; stroke-width: 3.5px !important; }
.link-line.highlighted.type-coauthor { stroke-opacity: 0.75 !important; stroke-width: 3px !important; }
.link-line.highlighted.type-advisor { stroke-opacity: 0.7 !important; stroke-width: 2.5px !important; }
.link-line.highlighted.type-colleague { stroke-opacity: 0.5 !important; stroke-width: 1.5px !important; stroke-dasharray: none !important; }

/* ===== Tooltip ===== */
#tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(28, 28, 30, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 8px;
  padding: 8px 12px;
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.15s;
  max-width: 240px;
}
#tooltip.visible { opacity: 1; }
.tooltip-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.12px;
  color: var(--apple-white);
}
.tooltip-org {
  font-size: 11px;
  letter-spacing: -0.08px;
  color: var(--apple-text-secondary);
  margin-top: 2px;
}

/* ===== Graph switcher dropdown (replaces top quick-links bar) ===== */
.graph-switcher { position: relative; display: flex; align-items: center; }
.graph-switcher-trigger {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 0.5px solid rgba(255, 255, 255, 0.14);
  cursor: pointer;
  padding: 6px 14px;
  border-radius: 8px;
  font-family: inherit; color: inherit;
  transition: all 0.15s;
}
.graph-switcher-trigger:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.22);
}
.graph-switcher.open .graph-switcher-trigger {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.28);
}
.graph-switcher-trigger .nav-title { margin: 0; }
.graph-chevron {
  width: 11px;
  height: 7px;
  color: rgba(255, 255, 255, 0.9);
  transition: transform 0.2s;
  margin-left: 2px;
  flex-shrink: 0;
}
.graph-switcher.open .graph-chevron { transform: rotate(180deg); }
.graph-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 180px;
  background: rgba(28, 28, 30, 0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 0.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  z-index: 1100;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  animation: graph-dropdown-fade 0.15s ease;
}
@keyframes graph-dropdown-fade {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.graph-dropdown[hidden] { display: none; }
.graph-dropdown-item {
  display: block;
  padding: 8px 12px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.78);
  text-decoration: none;
  border-radius: 6px;
  white-space: nowrap;
  font-family: inherit;
}
.graph-dropdown-item:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
.graph-dropdown-item.active {
  color: var(--apple-link-blue-dark);
  background: rgba(41, 151, 255, 0.1);
}
.graph-dropdown-sep {
  height: 1px;
  background: rgba(255, 255, 255, 0.08);
  margin: 4px 6px;
}

/* Subscribe button in nav-bar */
.nav-subscribe-btn {
  padding: 6px 16px;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 980px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: -0.12px;
  white-space: nowrap;
  margin-right: 8px;
  transition: background 0.2s;
}
.nav-subscribe-btn:hover { background: rgba(255, 255, 255, 0.85); }

/* Hamburger (mobile only) */
.nav-hamburger {
  display: none;
  width: 32px; height: 32px;
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.75);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  border-radius: 6px;
  margin-right: 6px;
  font-family: inherit;
  padding: 0;
  align-items: center;
  justify-content: center;

const scholars = [
  // ===== Industrial Design Masters =====
  {id:"dieterrams",name:"Dieter Rams",org:"Braun",title:"工业设计教父 · 10 Principles for Good Design",field:["industrial"],
    bio:"Born 1932 in Wiesbaden, Germany. Joined Braun in 1955, Chief of Design 1961-1995. Defined Braun's clean functional aesthetic. Iconic products: SK 4 record player (1956), 606 Universal Shelving System (1960), T3 pocket radio (1958, direct inspiration for the iPod). Authored '10 Principles for Good Design' (1970s). Philosophy 'Less, but better' (Weniger, aber besser) became foundational influence on Jony Ive at Apple. Officer of the Order of Merit Federal Republic of Germany. Vitsoe still produces his furniture today.",papers:[{y:"1956",t:"SK 4 record player (Braun)"},{y:"1960",t:"606 Universal Shelving System (Vitsoe)"},{y:"1970s",t:"10 Principles for Good Design"}]},
  {id:"jonyive",name:"Jony Ive",org:"LoveFrom",title:"Apple 前首席设计官 · 创办 LoveFrom",field:["industrial"],
    bio:"Born 1967 in London. Newcastle Polytechnic graduate. Joined Apple 1992, Chief Design Officer 1997-2019. Led design of iMac G3 (1998), iPod (2001), iPhone (2007), iPad (2010), Apple Watch (2015), all Mac hardware. KBE 2012. Left Apple 2019 to found LoveFrom design studio with Marc Newson. Strongly influenced by Dieter Rams. LoveFrom's first major work: Ferrari concepts and the Airbnb redesign with Brian Chesky (2024).",papers:[{y:"2001",t:"iPod"},{y:"2007",t:"iPhone"},{y:"2015",t:"Apple Watch"},{y:"2019",t:"Founded LoveFrom"}]},
  {id:"naotofukasawa",name:"Naoto Fukasawa",org:"MUJI / ±0",title:"MUJI 设计顾问 · ±0 创始人",field:["industrial"],
    bio:"Born 1956 in Yamanashi. Tama Art University. Joined IDEO Japan, then founded Naoto Fukasawa Design 2003. MUJI Advisory Board member since 2002 (alongside Kenya Hara, Sam Hecht, Jasper Morrison). Designed MUJI wall-mounted CD player (1999), MUJI humidifier, ±0 brand humidifier. Coined 'super normal' philosophy with Jasper Morrison. Without Thought workshop methodology. Royal Designer for Industry (UK). Currently Director of 21_21 Design Sight (Tokyo).",papers:[{y:"1999",t:"MUJI Wall-mounted CD player"},{y:"2003",t:"Founded Naoto Fukasawa Design"},{y:"2007",t:"Super Normal exhibition with Morrison"}]},
  {id:"jaspermorrison",name:"Jasper Morrison",org:"Jasper Morrison Studio",title:"Super Normal 哲学 · 英国产品设计代表",field:["industrial"],
    bio:"Born 1959 London. Royal College of Art graduate. Established Office for Design 1986 (now Jasper Morrison Studio in London/Paris/Tokyo). MUJI Advisory Board. Designed for Vitra, Cappellini, Magis, Alessi, Rowenta, Sony. 2007 'Super Normal' exhibition with Naoto Fukasawa launched the 'super normal' design philosophy - celebrating ordinary objects perfectly executed. RDI 2001.",papers:[{y:"1988",t:"Thinking Man's Chair (Cappellini)"},{y:"2007",t:"Super Normal book/exhibition"},{y:"2010",t:"Basel Tram (Bombardier)"}]},
  {id:"marcnewson",name:"Marc Newson",org:"LoveFrom / Apple",title:"Apple Watch 联设 · LoveFrom 联创",field:["industrial"],
    bio:"Born 1963 Sydney. Sydney College of the Arts. Iconic 1986 Lockheed Lounge sold for £2.4M (highest price for living designer). Designed for Cappellini, Apple, Ford, Nike, Qantas (interior). CBE 2012. Joined Apple as Special Projects Designer 2014, co-led Apple Watch design with Jony Ive. Co-founded LoveFrom 2019 with Ive. TIME 100 most influential 2005.",papers:[{y:"1986",t:"Lockheed Lounge"},{y:"2014",t:"Apple Watch (with Ive)"},{y:"2019",t:"Co-founded LoveFrom"}]},
  {id:"philippestarck",name:"Philippe Starck",org:"Starck Network",title:"法国跨界设计师 · 万物皆可设计",field:["industrial"],
    bio:"Born 1949 Paris. École Camondo. Began as Pierre Cardin Art Director (1968). Designed Café Costes 1984 (career-defining). Iconic: Juicy Salif lemon squeezer (Alessi 1990), Louis Ghost chair (Kartell 2002), Mickey Mouse-themed Mademoiselle chair. Designs span furniture, hotels, yachts (including for Steve Jobs), watches, toothbrushes. Most prolific commercial designer of late 20th century. Multiple French Légion d'honneur.",papers:[{y:"1990",t:"Juicy Salif (Alessi)"},{y:"2002",t:"Louis Ghost chair (Kartell)"},{y:"2008",t:"Steve Jobs's yacht Venus"}]},
  {id:"konstantingrcic",name:"Konstantin Grcic",org:"Konstantin Grcic Design",title:"工业设计 · 现代主义新一代",field:["industrial"],
    bio:"Born 1965 Munich, Germany. Royal College of Art London, then assistant to Jasper Morrison. Founded KGID 1991. Designed for Magis, Mattiazzi, Plank, Vitra, Iittala. Iconic: Mayday lamp (1999), Chair_One (Magis 2004), Pro chair (Flötotto 2013). Compasso d'Oro 2001, 2011. Now teaches at Hochschule für Bildende Künste Hamburg. Embodies new German rational-but-witty design.",papers:[{y:"1999",t:"Mayday lamp"},{y:"2004",t:"Chair_One (Magis)"},{y:"2013",t:"Pro chair (Flötotto)"}]},
  {id:"yvesbehar",name:"Yves Béhar",org:"Fuseproject",title:"Fuseproject 创始人 · 社会创新设计",field:["industrial"],
    bio:"Born 1967 Lausanne, Switzerland. Art Center College of Design Pasadena. Founded Fuseproject 1999 in San Francisco. Famous for: One Laptop Per Child (XO laptop 2007), Jawbone wearables, Herman Miller SAYL chair, August Smart Lock, Ouya gaming. Cofounder of Forme (smart mirror), Canopy (skincare). 2016 sold majority stake of Fuseproject to BlueFocus. Multiple AIGA medals. Champion of design for social good.",papers:[{y:"2007",t:"XO laptop (One Laptop Per Child)"},{y:"2010",t:"Jawbone Up wristband"},{y:"2014",t:"Herman Miller SAYL chair"}]},
  {id:"hartmutesslinger",name:"Hartmut Esslinger",org:"frog design (founder)",title:"frog design 创始人 · Apple Snow White 设计语言",field:["industrial"],
    bio:"Born 1944 Black Forest, Germany. Founded Esslinger Design 1969 (became frog design 1982). Hired by Steve Jobs 1982 with $1M annual contract — first major industrial design firm to define Apple's visual identity. Created the 'Snow White' design language used on Apple IIc, Macintosh SE, etc (1984-1990). Also designed for Sony Trinitron TV, Wega audio, Lufthansa, SAP, Microsoft. frog design has worked for HP, Disney, Sony — most influential design consultancy of the 80s/90s.",papers:[{y:"1982",t:"Founded frog design"},{y:"1984",t:"Apple Snow White design language"},{y:"1990",t:"Sony Trinitron design language"}]},
  {id:"eames",name:"Charles & Ray Eames",org:"Eames Office",title:"美国 20 世纪设计巨擘",field:["industrial"],
    bio:"Charles Eames (1907-1978) and Ray Kaiser Eames (1912-1988). Husband-and-wife duo founded Eames Office 1941 in Los Angeles. Pioneered molded plywood furniture (LCW chair 1946), fiberglass shells (DSW chair 1950), the Eames Lounge Chair (1956). Beyond furniture: Case Study House #8, films like 'Powers of Ten' (1977), exhibitions for IBM. The most influential American design partnership of the 20th century. Their work continues at Herman Miller and Vitra.",papers:[{y:"1946",t:"LCW Lounge Chair Wood"},{y:"1956",t:"Eames Lounge Chair (Herman Miller)"},{y:"1977",t:"Powers of Ten (film)"}]},
  {id:"ettoresottsass",name:"Ettore Sottsass",org:"Memphis Group",title:"Memphis 集团创始人 · Olivetti",field:["industrial"],
    bio:"Born 1917 Innsbruck (Italian). Polytechnic University of Turin architecture. Olivetti's lead consultant 1958-1980, designed the iconic Olivetti Valentine portable typewriter (1969, MoMA collection). Founded the Memphis Group 1981 in Milan, sparking the postmodern design movement that rebelled against good-taste minimalism with bright colors, wild patterns, asymmetric forms. Compasso d'Oro multiple times. Memphis influenced 80s/90s pop culture, fashion, and product design globally.",papers:[{y:"1969",t:"Olivetti Valentine typewriter"},{y:"1981",t:"Founded Memphis Group"},{y:"1981",t:"Carlton bookshelf (Memphis)"}]},
  {id:"patriciaurquiola",name:"Patricia Urquiola",org:"Studio Urquiola / Cassina",title:"西班牙设计师 · Cassina 艺术总监",field:["industrial"],
    bio:"Born 1961 Oviedo, Spain. Madrid Polytechnic + Milan Polytechnic. Worked with Achille Castiglioni, Vico Magistretti, Piero Lissoni. Founded Studio Urquiola 2001 in Milan. Cassina Art Director since 2015. Designs for B&B Italia, Moroso, Foscarini, Kettal, Mutina. Iconic: Tropicalia chair (Moroso 2008), Husk chair (B&B Italia 2011). Royal Designer for Industry. Compasso d'Oro 2011.",papers:[{y:"2008",t:"Tropicalia chair (Moroso)"},{y:"2011",t:"Husk chair (B&B Italia)"},{y:"2015",t:"Cassina Art Director"}]},
  {id:"karimrashid",name:"Karim Rashid",org:"Karim Rashid Inc",title:"加拿大-埃及设计师 · 'democratic design' 倡导者",field:["industrial"],
    bio:"Born 1960 Cairo (Egyptian-British-Canadian). Carleton University Ottawa. Founded Karim Rashid Inc 1993 in NYC. 4000+ products designed across 90+ countries. Iconic: Garbo trash can (1996, Umbra, sold 7M units), Oh chair, Dirt Devil Kone vacuum, Method cleaning products. 300+ awards. Hugely prolific commercial / colorful / 'sensual minimalism' style — divisive among design purists but enormously commercially successful.",papers:[{y:"1996",t:"Garbo trash can (Umbra, 7M sold)"},{y:"2007",t:"Method cleaning products"}]},
  {id:"rosslovegrove",name:"Ross Lovegrove",org:"Lovegrove Studio",title:"英国设计 · 'Organic Essentialism'",field:["industrial"],
    bio:"Born 1958 Cardiff Wales. Royal College of Art. Joined frog design 1980s (worked on Sony Walkman, Apple). Founded Lovegrove Studio 1990 London. Coined 'Organic Essentialism' — bio-inspired forms enabled by digital fabrication. Designed Sony Walkman, Olympus Eye Trek glasses, Ty Nant water bottle, Bombay Sapphire bottle, Air One chair (Edra). Royal Designer for Industry.",papers:[{y:"2001",t:"Air One chair (Edra)"},{y:"2006",t:"Ty Nant water bottle"}]},
  {id:"samhecht",name:"Sam Hecht",org:"Industrial Facility",title:"Industrial Facility 联创 · MUJI 设计核心",field:["industrial"],
    bio:"Born 1969 London. Royal College of Art. Worked at IDEO 1991-2002 (San Francisco then Tokyo). Co-founded Industrial Facility 2002 in London with Kim Colin. MUJI Advisory Board since 2003 alongside Naoto Fukasawa. Designed MUJI products (kitchen scales, calculators), Herman Miller, Mattiazzi, Established & Sons. Quiet, considered, super-normal aesthetic.",papers:[{y:"2002",t:"Founded Industrial Facility"},{y:"2003",t:"MUJI Advisory Board member"}]},
  {id:"tinkerhatfield",name:"Tinker Hatfield",org:"Nike",title:"Nike Air Jordan 主设计师",field:["industrial"],
    bio:"Born 1952 Hillsboro, Oregon. University of Oregon (architecture, also a pole vaulter). Joined Nike 1981 as corporate architect, switched to shoe design 1985. Vice President for Design + Special Projects at Nike. Designed Air Jordan 3 (1988) through Air Jordan 15, plus Air Max 1, Nike Mag (Back to the Future self-lacing). The most influential athletic shoe designer in history. Inducted into Footwear News Hall of Fame.",papers:[{y:"1988",t:"Air Jordan 3"},{y:"1987",t:"Nike Air Max 1"},{y:"2016",t:"Nike Mag self-lacing (BTTF)"}]},

  // ===== Graphic / Brand Design =====
  {id:"paulrand",name:"Paul Rand",org:"Yale (taught) / freelance",title:"美国现代品牌设计奠基人 · IBM/UPS/ABC logos",field:["graphic"],
    bio:"Born 1914 NYC, died 1996. Pratt Institute / Art Students League. Self-taught into modernist graphic design. Designed iconic logos: IBM (1956 + 1972 striped version), ABC TV (1962), UPS (1961, redesigned 2003), Westinghouse (1960), Enron (1996), Steve Jobs's NeXT logo (1986, charged $100k for it). Authored 'Thoughts on Design' (1947). Yale School of Art professor 1956-1985. Brought European modernism to American corporate identity.",papers:[{y:"1956",t:"IBM logo"},{y:"1961",t:"UPS logo"},{y:"1986",t:"NeXT logo for Steve Jobs ($100k)"}]},
  {id:"massimovignelli",name:"Massimo Vignelli",org:"Vignelli Associates",title:"NYC 地铁地图 · Helvetica 倡导者",field:["graphic"],
    bio:"Born 1931 Milan, died 2014 NYC. Polytechnic University of Milan. Co-founded Unimark International 1965 (later Vignelli Associates 1971). Designed: NYC Subway signage system (1970, with Bob Noorda, used for 50+ years), American Airlines identity (1968-2013), Bloomingdale's brown bag, Knoll logo, Saint Peter's Church NYC. Strong advocate for Helvetica typeface. 'If you can design one thing, you can design everything.' AIGA Medal 1983.",papers:[{y:"1968",t:"American Airlines logo (used 45 years)"},{y:"1970",t:"NYC Subway signage (with Bob Noorda)"},{y:"1972",t:"NYC Subway map"}]},
  {id:"paulascher",name:"Paula Scher",org:"Pentagram",title:"Pentagram 合伙人 · Citi/MoMA/Tiffany identity",field:["graphic"],
    bio:"Born 1948 Washington DC. Tyler School of Art. Started at CBS Records 1970s (300+ album covers, 4 Grammys). Co-founded Koppel & Scher 1984. Joined Pentagram 1991 — first female partner. Designed identities for Citibank (2000), MoMA (2009), Tiffany & Co (2014), Microsoft Windows logo (2012), Public Theater NYC (1994 ongoing), Bloomberg, Microsoft. Iconic typographic and bold-color style. AIGA Medal 2001.",papers:[{y:"1994",t:"Public Theater identity (NYC)"},{y:"2000",t:"Citibank logo"},{y:"2014",t:"Tiffany & Co identity"}]},
  {id:"stefansagmeister",name:"Stefan Sagmeister",org:"Sagmeister & Walsh → Sagmeister Inc",title:"奥地利设计师 · 极致表达派",field:["graphic"],
    bio:"Born 1962 Bregenz, Austria. Pratt Institute MFA. Worked for Tibor Kalman at M&Co. Founded Sagmeister Inc 1993. Co-founded Sagmeister & Walsh 2012-2019 with Jessica Walsh. Famous for the 1999 AIGA poster — text carved into his own torso. Album covers for Lou Reed, Rolling Stones, Talking Heads, OK Go. 2 Grammys. Sabbatical-driven creative practice. TED talks on happiness through design.",papers:[{y:"1999",t:"AIGA Detroit poster (carved into torso)"},{y:"2008",t:"The Happy Show"}]},
  {id:"miltonglaser",name:"Milton Glaser",org:"Pushpin Studios / Milton Glaser Inc",title:"I ♥ NY logo · 美国流行设计教父",field:["graphic"],
    bio:"Born 1929 NYC, died 2020. Cooper Union, Academia di Belle Arti Bologna. Co-founded Pushpin Studios 1954. Founded Milton Glaser Inc 1974. Designed: I ♥ NY logo (1977, pro bono for NY State, became most-imitated logo ever), Bob Dylan poster (1966), DC Comics logo (1977), Brooklyn Brewery logo (1996). National Medal of Arts 2009 — first graphic designer to receive it. SVA professor 50+ years. AIGA Medal 1972.",papers:[{y:"1966",t:"Bob Dylan poster"},{y:"1977",t:"I ♥ NY logo"},{y:"1977",t:"DC Comics logo"}]},
  {id:"saulbass",name:"Saul Bass",org:"Saul Bass Associates",title:"电影片头海报奠基人 · AT&T/UA logos",field:["graphic"],
    bio:"Born 1920 NYC, died 1996. Art Students League / Brooklyn College. Pioneered the modern movie title sequence with Otto Preminger ('The Man with the Golden Arm' 1955). Designed title sequences for Hitchcock (Psycho/Vertigo/North by Northwest), Scorsese (Casino/Cape Fear), Kubrick (Spartacus). Logos: AT&T (1969 + 1983 globe), United Airlines (1974), Continental (1968), Bell System (1969). Oscar 1969 (animated short). 1996 last work was Casino titles.",papers:[{y:"1955",t:"The Man with the Golden Arm (titles)"},{y:"1969",t:"AT&T logo (Bell System)"},{y:"1974",t:"United Airlines logo"}]},
  {id:"jessicawalsh",name:"Jessica Walsh",org:"&Walsh",title:"Sagmeister & Walsh 联创 → &Walsh CEO",field:["graphic"],
    bio:"Born 1986 Connecticut. RISD. Joined Sagmeister Inc 2008, became partner 2012 forming Sagmeister & Walsh. Notable: 40 Days of Dating (viral 2013). Founded &Walsh 2019 (her solo studio). Clients: Apple, Ford, Levi's, Adidas, Snapchat. Strong advocate for women in design. Forbes 30 Under 30 (2014). Vibrant, surreal, photo-illustration-driven visual style.",papers:[{y:"2013",t:"40 Days of Dating (viral project)"},{y:"2019",t:"Founded &Walsh"}]},
  {id:"erikspiekermann",name:"Erik Spiekermann",org:"MetaDesign / FontShop",title:"FontShop 创始人 · FF Meta/Lufthansa typography",field:["graphic"],
    bio:"Born 1947 Stadthagen, Germany. Free University Berlin (art history). Co-founded MetaDesign 1979 (Berlin, became one of largest design firms). Co-founded FontShop 1989 (first digital type retailer). Designed FF Meta typeface (1991) — called 'the Helvetica of the 90s'. Designed identity for Audi, Volkswagen, Lufthansa, Deutsche Bahn corporate type. AIGA Medal 2011. Honorary Royal Designer for Industry. Author 'Stop Stealing Sheep' on typography.",papers:[{y:"1989",t:"Co-founded FontShop"},{y:"1991",t:"FF Meta typeface"},{y:"1995",t:"Lufthansa identity"}]},
  {id:"otlaicher",name:"Otl Aicher",org:"HfG Ulm",title:"1972 慕尼黑奥运会 + Lufthansa 设计",field:["graphic"],
    bio:"Born 1922 Ulm, Germany, died 1991. Co-founded Hochschule für Gestaltung Ulm 1953 (the post-Bauhaus design school). Designed identity for Lufthansa 1969 (used until 2018), 1972 Munich Olympics (introduced pictogram system that became universal Olympic standard), ERCO lighting. Created Rotis typeface (1988). Defined corporate identity as a discipline in Germany. Husband of Inge Scholl (Sophie Scholl's sister).",papers:[{y:"1969",t:"Lufthansa identity (used 50 years)"},{y:"1972",t:"Munich Olympics (pictograms)"},{y:"1988",t:"Rotis typeface"}]},
  {id:"josefmullerbrockmann",name:"Josef Müller-Brockmann",org:"Swiss Style",title:"瑞士国际主义平面设计代表",field:["graphic","typography"],
    bio:"Born 1914 Rapperswil Switzerland, died 1996. Defining figure of Swiss International Typographic Style — grid systems, sans-serif type, asymmetric layouts, photography-over-illustration. Designed iconic Zurich Tonhalle concert posters (1950s-60s). Authored 'Grid Systems in Graphic Design' (1981) — became the bible of grid-based design. Founded Neue Grafik magazine 1958. Co-founded the magazine that defined the Swiss Style abroad.",papers:[{y:"1950s",t:"Zurich Tonhalle posters"},{y:"1958",t:"Neue Grafik magazine"},{y:"1981",t:"Grid Systems in Graphic Design (book)"}]},
  {id:"jantschichold",name:"Jan Tschichold",org:"Penguin Books",title:"Die Neue Typographie · Penguin 重设计师",field:["graphic","typography"],
    bio:"Born 1902 Leipzig, died 1974. Bauhaus exposure 1923. Authored 'Die Neue Typographie' (1928) — the manifesto of modernist asymmetric type design. Fled Nazi Germany 1933. Hired by Penguin Books 1947 — completely redesigned all Penguin titles into the iconic standardized format used today. Designed Sabon typeface (1967). His shift from radical modernism to classical typography late in career remains a famous design trajectory.",papers:[{y:"1928",t:"Die Neue Typographie (book)"},{y:"1947",t:"Penguin Books redesign"},{y:"1967",t:"Sabon typeface"}]},
  {id:"davidcarson",name:"David Carson",org:"Ray Gun magazine",title:"反网格设计 · Ray Gun 主美",field:["graphic"],
    bio:"Born 1955 Corpus Christi Texas. Self-taught (was a pro surfer). Art Director at Ray Gun magazine 1992-1995 — created the most influential anti-grid, deconstructed editorial design of the 90s. Designed for Pepsi, Nike, MTV, Sony, Microsoft. 'The End of Print' (1995) sold 200K+ copies. Inspired a generation of grunge / experimental designers. Anti-Müller-Brockmann philosophy.",papers:[{y:"1992",t:"Ray Gun magazine art direction"},{y:"1995",t:"The End of Print (book, 200K+ sold)"}]},

  // ===== UX / UI / Digital =====
  {id:"donnorman",name:"Don Norman",org:"NN/g · UCSD",title:"《设计心理学》作者 · 用户体验之父",field:["ux"],
    bio:"Born 1935. UPenn psychology PhD. Coined the term 'User Experience' at Apple 1993 as VP Advanced Technology. Founded Nielsen Norman Group 1998 with Jakob Nielsen. Authored 'The Design of Everyday Things' (1988) — most-read design book ever. UCSD professor (Cognitive Science). Critic of bad design — popularized concepts of affordances, signifiers, mental models, the 'Norman door'. National Academy of Engineering. AIGA Medal 2006.",papers:[{y:"1988",t:"The Design of Everyday Things (book)"},{y:"1998",t:"Co-founded Nielsen Norman Group"}]},
  {id:"jakobnielsen",name:"Jakob Nielsen",org:"NN/g",title:"NN/g 联创 · 可用性工程教父",field:["ux"],
    bio:"Born 1957 Denmark. Technical University of Denmark PhD. Sun Microsystems Distinguished Engineer (web usability research). Co-founded Nielsen Norman Group 1998 with Don Norman. Authored 'Usability Engineering' (1993) — defined the field. Created the '10 Heuristics' for usability evaluation (1994) — still the standard. Pioneered the 5-user usability test. 79 patents.",papers:[{y:"1993",t:"Usability Engineering (book)"},{y:"1994",t:"10 Usability Heuristics"},{y:"1998",t:"Co-founded NN/g"}]},
  {id:"johnmaeda",name:"John Maeda",org:"Everbridge / Automattic / SVA",title:"MIT Media Lab → RISD 校长 · 计算设计代表",field:["ux","graphic"],
    bio:"Born 1966 Seattle. MIT BS/MS, Tsukuba PhD (design). MIT Media Lab faculty 1996-2008 (founded SIMPLICITY group). RISD President 2008-2013. Joined eBay 2014, then Automattic, now Everbridge. Authored 'The Laws of Simplicity' (2006) — defined 'simplicity' as design principle. Pioneered computational design + creative coding (Processing language influence). National Design Award 2001. AIGA Medal 2010.",papers:[{y:"2006",t:"The Laws of Simplicity (book)"},{y:"2008",t:"RISD President"}]},
  {id:"bretvictor",name:"Bret Victor",org:"Dynamicland",title:"交互设计哲学家 · Inventing on Principle",field:["ux"],
    bio:"Born ~1976. Caltech BS, UC Berkeley MS. Apple Human Interface Designer (worked on iPad concept). Founded Dynamicland 2014 (research lab in Oakland). Famous 2012 talk 'Inventing on Principle' — defining vision for live-coding-feedback interactive systems. Subsequent essays 'Up and Down the Ladder of Abstraction', 'Magic Ink', 'Drawing Dynamic Visualizations' became seminal HCI references. Reclusive, highly influential among interaction designers.",papers:[{y:"2012",t:"Inventing on Principle (talk)"},{y:"2014",t:"Founded Dynamicland"}]},
  {id:"susankare",name:"Susan Kare",org:"Apple alum / Niiice.co",title:"Mac 图标设计师 · UI 图标之母",field:["ux","graphic"],
    bio:"Born 1954 Ithaca NYC. NYU PhD art history. Hired by Steve Jobs at Apple 1982. Designed all original Macintosh icons (1984): the Happy Mac, the Trash, the Lasso, the Bomb. Created Chicago typeface (used in original Mac OS, then iPod). Left Apple 1986 with Jobs to NeXT, then designed icons for Windows 3.0 (Microsoft 1991), IBM, Facebook (early), Pinterest. AIGA Medal 2018. The most influential interface designer no one knew.",papers:[{y:"1984",t:"Original Macintosh icons + Chicago typeface"},{y:"1991",t:"Windows 3.0 icons"}]},
  {id:"scottbelsky",name:"Scott Belsky",org:"Adobe (CSO)",title:"Behance 创始人 · Adobe 创意业务总监",field:["ux"],
    bio:"Born 1980 Pittsburgh. Cornell undergrad, Harvard MBA. Founded Behance 2006 (creative portfolio platform, sold to Adobe 2012 for $150M). Authored 'Making Ideas Happen' (2010), 'The Messy Middle' (2018). Adobe CSO + EVP Creative Cloud since 2017. Early investor: Pinterest, Uber, Sweetgreen, Periscope, Warby Parker. Personal blog widely read by design entrepreneurs.",papers:[{y:"2006",t:"Founded Behance"},{y:"2012",t:"Behance acquired by Adobe ($150M)"},{y:"2018",t:"The Messy Middle (book)"}]},
  {id:"tobiasvanschneider",name:"Tobias van Schneider",org:"DESK Studio",title:"前 Spotify Sr Designer · 创办 DESK + 数字游民",field:["ux","graphic"],
    bio:"Born ~1986 Austria. Self-taught designer. Joined Spotify 2014-2017 as Senior Product Designer (NYC). Co-founded Semplice (CMS for designers) 2016. Founded DESK Studio 2017 with co-founders. Co-founded Mymind (visual bookmarking) 2020. Newsletter (200k+ subs) on remote work + design entrepreneurship. Strong indie-design / digital nomad voice.",papers:[{y:"2014",t:"Spotify Sr Product Designer"},{y:"2016",t:"Founded Semplice"},{y:"2020",t:"Co-founded Mymind"}]},
  {id:"juliezhuo",name:"Julie Zhuo",org:"Sundial · ex-Facebook",title:"前 Facebook 产品设计副总裁 · 写作型 PM",field:["ux"],
    bio:"Born ~1983 Shanghai (immigrated). Stanford CS. Joined Facebook as 1st female engineer-turned-designer 2006. Rose to VP of Product Design (managed 200+ designers) by age 28. Authored 'The Making of a Manager' (2019) — bestseller on tech management. Left Facebook 2020 to co-found Sundial (data product). Newsletter Looks Good widely read among tech designers/managers.",papers:[{y:"2019",t:"The Making of a Manager (book)"},{y:"2020",t:"Co-founded Sundial"}]},

  // ===== Type Design / Additional Western =====
  {id:"wolfgangweingart",name:"Wolfgang Weingart",org:"Basel School of Design",title:"瑞士字体学派 → New Wave 革命者",field:["typography","graphic"],
    bio:"Born 1941 Salem Germany, died 2021. Studied Basel School of Design. Taught at Basel from 1968 — initially Swiss Style purist, then radically broke with the rigid grid in 1970s, pioneering 'Swiss Punk' / 'New Wave' typography (chaotic mixed type, photographic typography, deliberate disruption). Influenced April Greiman, Dan Friedman, and a whole generation of postmodern designers. Bridge between Swiss modernism and 1980s deconstruction.",papers:[{y:"1968",t:"Basel teaching career"},{y:"1976",t:"Typographic Process series"}]},
  {id:"aarondraplin",name:"Aaron Draplin",org:"Draplin Design Co (DDC)",title:"Field Notes 联创 · 美国工匠风设计",field:["graphic"],
    bio:"Born 1969 Detroit. Self-taught (snowboarder background). Founded Draplin Design Co (DDC) 2005 in Portland. Co-founded Field Notes 2008 with Coudal Partners (small notebooks, sold 50M+). Designed for Burton Snowboards, Nike, Esquire, Patagonia, Carhartt, Cobra Dogs. Authored 'Pretty Much Everything' (2016). Personifies the 'rugged American workmanship' graphic design style.",papers:[{y:"2005",t:"Founded Draplin Design Co"},{y:"2008",t:"Co-founded Field Notes (50M sold)"}]},

  // ===== Japanese =====
  {id:"kenyahara",name:"Kenya Hara",org:"MUJI Art Director",title:"原研哉 · MUJI 艺术总监 · '白' 哲学",field:["graphic","industrial"],
    bio:"Born 1958 Okayama, Japan. Musashino Art University. Hara Design Institute President (Nippon Design Center). MUJI Art Director since 2002 — defines MUJI's visual identity (those minimalist 地平线/horizon ad campaigns). Designed identity for Tsutaya, Roppongi Hills. Authored 'Designing Design' (2007), 'White' (2010), 'Ex-formation' (2017). Pioneered 'emptiness' as Japanese design philosophy worth exporting globally.",papers:[{y:"2002",t:"MUJI Art Director"},{y:"2007",t:"Designing Design (book)"},{y:"2010",t:"White (book)"}]},
  {id:"okisato",name:"Oki Sato",org:"Nendo",title:"Nendo 创始人 · 日本极简主义代表",field:["industrial"],
    bio:"Born 1977 Toronto (Japanese). Waseda University Master of Architecture. Founded Nendo 2002 in Tokyo. 200+ projects per year. Designed for Cappellini, Camper, Issey Miyake, Tod's, Coca-Cola, Lexus, Starbucks. Iconic small playful 'click moment' product design. 2012 Wallpaper Designer of the Year. Tokyo 2020 Olympic torch design.",papers:[{y:"2002",t:"Founded Nendo"},{y:"2020",t:"Tokyo 2020 Olympic torch"}]},
  {id:"kashiwasato",name:"Kashiwa Sato",org:"Samurai Inc",title:"佐藤可士和 · UNIQLO 品牌设计师",field:["graphic"],
    bio:"Born 1965 Tokyo. Tama Art University. Joined Hakuhodo 1989, founded Samurai Inc 2000. Defined UNIQLO's global brand identity 2006-present (red square logo, store design, advertising). Designed 7-Eleven Japan rebrand, Honda Stepwgn, Tsutaya T-Card, Rakuten logo, Imabari Towel. Most influential Japanese commercial brand designer. Visiting professor Tama Art University. Author 'Kashiwa Sato's Ultimate Method to Reach the Essentials'.",papers:[{y:"2006",t:"UNIQLO global rebrand"},{y:"2000",t:"Founded Samurai Inc"}]},

  // ===== Chinese Designers =====
  {id:"kantaikeung",name:"Kan Tai-keung",org:"靳叔包装",title:"靳埭强 · 香港平面设计教父",field:["graphic","chinese"],
    bio:"Born 1942 广东番禺. 香港浸会学院. 自学成才,为新华、太古、屈臣氏、中国银行设计 logo (1984 中行红五星 logo 沿用至今). 创办「靳埭强设计奖」推动华人设计教育. 受张光宇、王无邪影响,融合中国水墨与现代设计. AGI 会员,香港艺术发展局视觉艺术主席. 著作《设计心法》《关于设计的 110 个故事》. 在中国大陆与靳与刘合作创立 KL&K Design.",papers:[{y:"1984",t:"中国银行 Logo"},{y:"1999",t:"创办靳埭强设计奖"}]},
  {id:"alanchan",name:"Alan Chan",org:"Alan Chan Design",title:"陈幼坚 · 香港品牌设计代表",field:["graphic","chinese"],
    bio:"Born 1950 Hong Kong. 中学毕业自学,1980 创立 Alan Chan Design Company. 设计 Tsutaya 香港、HSBC、Watson's、Mandarin Oriental、Shanghai Tang 视觉识别. 「东西合璧」最具商业代表性的华人设计师. 600+ 国际奖项. 2002 创办上海 Alan Chan Creations 工作室. 香港艺术中心荣誉院士. 《时代》评选 'Asia's 25 most influential people' 1996.",papers:[{y:"1994",t:"Tsutaya Hong Kong"},{y:"1996",t:"Shanghai Tang Visual Identity"}]},
  {id:"hejianping",name:"He Jianping",org:"Hesign Berlin/Shanghai",title:"何见平 · 中德双线运营 · 海报艺术家",field:["graphic","chinese"],
    bio:"Born 1973 浙江. 杭州中国美术学院 → 柏林艺术大学. 师承 Helmut Schmid. 创办 Hesign 工作室(柏林 2003 / 上海 2004). 全球各大海报双年展常胜军(华沙、布鲁诺、墨西哥金奖等 100+). 创办「Hesign 出版社」、组织「中国海报双年展」. 中国美术学院 + 柏林艺术大学双教职. 著作《设计 + 文化》(德文)、《设计的旅行》",papers:[{y:"2003",t:"创办 Hesign Berlin"},{y:"2010s",t:"100+ 国际海报奖"}]},
  {id:"hanjiaying",name:"Han Jiaying",org:"Han Jiaying Design",title:"韩家英 · 深圳现代品牌设计代表",field:["graphic","chinese"],
    bio:"Born 1961 北京. 西安美术学院. 1990 南下深圳,1993 创办韩家英设计有限公司. 设计万科、招商银行、中国国际海运集装箱、深圳中国设计大展等品牌识别. AGI 会员. 中国最早一批将国际设计语言带入大陆品牌的设计师. 「2008 北京奥运视觉设计」核心成员. 数次代表中国设计参加国际三年展.",papers:[{y:"1993",t:"创办韩家英设计"},{y:"2008",t:"参与北京奥运视觉设计"}]},
  {id:"heiyiyang",name:"Hei Yiyang",org:"SenseTeam (山河水)",title:"黑一烊 · SenseTeam 创始人",field:["graphic","chinese"],
    bio:"Born 1971 广东惠州. 自学派. 2003 创办深圳「山河水设计 SenseTeam」. 设计华为终端品牌(Mate 系列视觉)、网易云音乐、龙湖地产、Manner 咖啡等. 2010 代表中国登上《Communication Arts》封面. AGI 中国区会员. 「黑色」标签是行业 insider 的共识符号. 多次操刀「字体设计 + 品牌」交叉项目,推动中文字体在新生代中商业化运用.",papers:[{y:"2003",t:"创办 SenseTeam"},{y:"2018",t:"网易云音乐 视觉系统"}]},
  {id:"zhuzhiwei",name:"Zhu Zhiwei",org:"方正字库",title:"朱志伟 · 中文字库元老 · 兰亭黑/博雅宋设计者",field:["typography","chinese"],
    bio:"Born 1956 北京. 北京印刷学院. 1989 加入方正,中国数字字库奠基人之一. 主导设计「方正兰亭黑」「方正博雅宋」「方正悠黑」等中文经典字体. 兰亭黑被苹果选为 Mac OS X 系统简体中文默认字体(2010 年起). 2018 「方正悠黑」入选中国第二届字体设计大奖. 影响整个中文数字阅读时代的视觉基础.",papers:[{y:"2002",t:"方正兰亭黑(后成 macOS 系统字体)"},{y:"2008",t:"方正博雅宋"},{y:"2018",t:"方正悠黑"}]},
  {id:"zhuyingchun",name:"Zhu Yingchun",org:"南京艺术学院",title:"朱赢椿 · 书籍设计大师",field:["graphic","chinese"],
    bio:"Born 1970 江苏盐城. 南京师范大学美术系. 南京艺术学院教授 + 书衣坊主持人. 设计书籍《不裁》《肥肉》《虫子书》《设计诗》— 累计获德国莱比锡「世界最美的书」金奖、中国「最美的书」十多次. 「实物 + 概念 + 文学」三位一体的书籍设计开创者. 中国最具有「书是物」哲学的设计师. 受日本杉浦康平影响.",papers:[{y:"2007",t:"《不裁》(获德国莱比锡世界最美的书)"},{y:"2009",t:"《设计诗》"}]},
  {id:"yangmingjie",name:"Yang Mingjie",org:"YANG DESIGN / 羊舍",title:"杨明洁 · 中国工业设计代表 / 羊舍创始人",field:["industrial","chinese"],
    bio:"Born 1971 杭州. 中国美术学院 + 同济大学 + 慕尼黑工业大学 / 西门子研究院. 2005 创办 YANG DESIGN(上海),工业设计 + 产品策略咨询. 2014 推出自主品牌「羊舍 Yang House」家具. 客户:海尔、华为、奔驰、米其林、可口可乐. 出版《设计的醒觉》. 中国大陆最商业成熟的工业设计师之一,国际设计奖项最多的中国设计师.",papers:[{y:"2005",t:"创办 YANG DESIGN"},{y:"2014",t:"创办「羊舍 Yang House」家具品牌"}]},
  {id:"jiawei",name:"Jia Wei",org:"LKK 洛可可",title:"賈伟 · 洛可可创始人 · 大中型设计公司模式",field:["industrial","chinese"],
    bio:"Born 1973 太原. 北京理工大学工业设计. 2004 创办洛可可创新设计集团(LKK),发展为中国规模最大的设计咨询公司之一(800+ 员工 / 全国 8 城市分公司). 客户覆盖海尔、美的、华为、三星、可口可乐 1000+ 品牌. 红点/IF 等国际奖项 100+. 2018 创办「洛客 LKKER」设计众包平台. 推动中国从代工(OEM)转向自主设计(ODM)的代表人物.",papers:[{y:"2004",t:"创办 LKK 洛可可"},{y:"2018",t:"创办洛客平台"}]},
  {id:"zhouchenchen",name:"Zhou Chenchen",org:"Frank Chou Design Studio",title:"周宸宸 Frank Zhou · 国内当代家具设计代表",field:["industrial","chinese"],
    bio:"Born 1986 北京. 中央美术学院家具设计 + 米兰理工学院产品设计. 2012 创办 Frank Chou Design Studio. 受日本/北欧家具影响,但探索中国当代产品语境. 设计「Combo」沙发(2017,广州设计周年度家具)、「Cube」椅. 与意大利 Cassina、丹麦 Stellar Works 合作. 代表中国 80/90 后家具设计语言走向国际. 米兰设计周中国设计师常驻代表.",papers:[{y:"2012",t:"创办 Frank Chou Design Studio"},{y:"2017",t:"Combo Sofa(广州设计周年度家具)"}]},
  {id:"lincunzhen",name:"Lin Cunzhen",org:"中央美术学院",title:"林存真 · 北京冬奥设计总监 + 字体设计",field:["graphic","chinese"],
    bio:"Born 1971 山东. 中央美术学院 + 莱比锡视觉艺术学院博士. 中央美术学院设计学院副院长. 2022 北京冬奥会会徽「冬梦」主设计师 + 视觉形象设计总监. 「方正悠黑」字体合作开发. 当代中国具备国际视野且承担国家级视觉项目的代表设计师.",papers:[{y:"2017",t:"北京冬奥会徽「冬梦」"},{y:"2022",t:"北京冬奥视觉形象总设计师"}]},
  {id:"jianghua",name:"Jiang Hua",org:"中国美术学院",title:"蒋华 · 中国当代字体设计教育者",field:["typography","chinese"],
    bio:"Born 1971 杭州. 中国美术学院视觉传达硕士. 中国美术学院设计学院教授. 创办「Type is Beautiful」中文字体网志(2007). 著作《这个杀手不太冷:汉字字体设计对话录》. 中国最早一批系统性引入西方字体设计理论的学者,影响新一代华文字体设计者. AGI 会员.",papers:[{y:"2007",t:"创办 Type is Beautiful"},{y:"2018",t:"《汉字字体设计对话录》"}]},
  {id:"wangmin",name:"Wang Min",org:"中央美术学院",title:"王敏 · 央美设计学院前院长 + 北京奥运",field:["graphic","chinese"],
    bio:"Born 1956 北京. 中央工艺美术学院 + 美国耶鲁大学硕士. 1990s 在 Adobe / 苹果 / 微软担任艺术总监. 2002 回国任中央美术学院设计学院院长 (2002-2018). 2008 北京奥运会形象与景观艺术总监. 「奥运同心结」视觉系统主导者. 推动中国设计教育与国际接轨,培养整整一代国内设计领导者.",papers:[{y:"2008",t:"北京奥运形象与景观艺术总监"},{y:"2002",t:"央美设计学院院长"}]},
  {id:"liude",name:"Liu De",org:"Xiaomi",title:"小米联合创始人 · 工业设计副总裁",field:["industrial","chinese"],bio:"1973 年生。北京理工大学工业设计学士 + 机械设计硕士 + Art Center College of Design 工业设计硕士。2010 年与雷军等八人共同创立小米,长期主管小米硬件工业设计与生态链业务,定义了小米手机/电视/盒子的「极简白」工业设计语言。是中国移动互联网时代第一批将硅谷工业设计教育(Art Center)引入大陆消费电子的领导者。现任小米集团执行董事 + 高级副总裁 + 集团总干部部部长。",papers:[{y:"2010",t:"小米联合创立"},{y:"2013",t:"小米电视设计语言"}]},
  {id:"liwanqiang",name:"Li Wanqiang",org:"Xiaomi",title:"小米联合创始人 · 前金山 UI 主管 · Mi 品牌",field:["graphic","ux","chinese"],bio:"小米联合创始人之一,前金山软件 UI 主管。2010 年与雷军等创办小米,主导早期小米品牌识别(MI logo)、MIUI 视觉系统、小米营销与品牌内容。是《参与感》一书的作者(2014 年最畅销互联网营销书,核心案例为小米)。后任小米电视部门总经理。中国互联网产品「品牌-视觉-营销」一体化运作的范式开创者。",papers:[{y:"2010",t:"小米联合创立 + MI logo"},{y:"2014",t:"《参与感》(畅销书)"}]},
  {id:"tangmu",name:"Tang Mu",org:"Ruying Smart",title:"前腾讯 CDC 总经理 → 小米生态链 → 如影智能 CEO",field:["ux","industrial","chinese"],bio:"华南理工大学国际会计学士。第一份工作金山(黎万强是直接 UI 主管)。2003 加入腾讯,组建腾讯用户体验设计中心(CDC),管 300+ 设计师,负责 QQ/QQ 音乐/QQ 游戏等百款产品。早期 QQ 头像出自他手。2013 加入小米任生态链副总裁,主导小米路由器、智能家居产品设计。后离开小米创立北京如影智能科技 CEO。",papers:[{y:"2003",t:"创立腾讯 CDC"},{y:"2013",t:"小米路由器"},{y:"2018",t:"创办如影智能"}]},
  {id:"yangyan",name:"Yang Yan",org:"Meizu Flyme",title:"魅族 Flyme 副总裁 · Flyme 设计灵魂",field:["ux","graphic","chinese"],bio:"魅族 Flyme OS 视觉与交互设计灵魂人物。2010 年代魅族软硬件团队 10 余人时期就主导 Flyme 早期版本设计。2014 年原 Flyme 负责人马麟离职后接任,带领团队迭代 Flyme 4/5/6/7/8 系列。2017 年组织调整后任 Flyme 事业部独立后升任副总裁。Flyme 在 2013-2018 年间被业内视为中国 Android 定制 ROM 的设计标杆。",papers:[{y:"2014",t:"接任 Flyme 负责人"},{y:"2017",t:"Flyme 事业部副总裁"}]},
  {id:"luoziyong",name:"Luo Zixiong",org:"独立设计师",title:"前锤子科技设计 → 国内独立设计师代表",field:["ux","graphic","chinese"],bio:"原锤子科技(Smartisan OS)核心 UI 设计师之一,参与早期 Smartisan OS 视觉系统。后离开锤子成为自由设计师,创办 LxU 设计圆桌。在国内设计圈持续输出方法论和职业建议,影响一代中国 80/90 后 UI/产品设计师。",papers:[{y:"2012",t:"Smartisan OS 视觉设计"},{y:"2015",t:"LxU 设计圆桌"}]},
  {id:"geyanan",name:"Ge Yanan",org:"vivo",title:"vivo OriginOS 设计总监",field:["ux","chinese"],bio:"vivo OriginOS 设计总监,主导 vivo 自研操作系统视觉与交互设计语言(OriginOS 1.0 → 4.0)。OriginOS 2020 发布以「华容网格」打破国内 Android 定制 ROM 同质化布局,被业内视为继 Flyme 之后中国厂商在 UI 设计上的又一次系统级创新。",papers:[{y:"2020",t:"OriginOS 1.0 华容网格"},{y:"2024",t:"OriginOS 4 全场景"}]},
  {id:"ryolu",name:"Ryo Lu",org:"Cursor",title:"Cursor 设计负责人 · 前 Notion 5 年设计师",field:["ux"],bio:"加拿大华裔设计师。早期在 Asana、Stripe 工作。2019-2025 在 Notion 工作 5 年。2025 年 1 月跳槽至 Cursor 任 Head of Design——AI native coding 代表设计师。他用 Cursor 自己写出 ryOS 个人作品。在 X (@ryolu_) 上是 AI native designer 标志性人物,影响一整批「设计 + 写代码」的新一代 designer。",papers:[{y:"2019",t:"加入 Notion(5 年)"},{y:"2025",t:"加入 Cursor 任设计负责人"}]},
  {id:"ivanzhao",name:"Ivan Zhao",org:"Notion",title:"Notion 联创 + CEO · 设计师创业者代表",field:["ux"],bio:"出生于中国,童年移居加拿大。UBC 认知科学 + 美术辅修。中学时学编程。从小研习中国传统水墨画。早期在教育出版创业 Inkling 任产品设计师。2013 与 Simon Last 联创 Notion。2019-2020 几乎倒闭后凤凰涅槃,2025 估值超千亿美金。代表 designer-founder 路径——Notion 整个产品哲学源自他对「乐高式知识工具」的执念。",papers:[{y:"2013",t:"创办 Notion"},{y:"2024",t:"Notion AI 上线"}]},
  {id:"karrisaarinen",name:"Karri Saarinen",org:"Linear",title:"Linear 联创 + CEO · 设计师血统的项目工具",field:["ux"],bio:"芬兰设计师 + 工程师。早期联创 Kippt(被 Coinbase 收购)。Coinbase 早期设计 + Head of Design。Airbnb Principal Designer + Design Systems Lead。2019 创办 Linear。Linear 以「极致软件 craft」著称,客户包括 OpenAI / Ramp / Vercel。2024 估值 12.5 亿美金。代表「设计师创业者把 craft 信念注入企业级软件」的路径。",papers:[{y:"2019",t:"创办 Linear"},{y:"2024",t:"Linear 12.5 亿美金估值"}]},
  {id:"joegebbia",name:"Joe Gebbia",org:"Airbnb",title:"Airbnb 联合创始人 · RISD 设计师",field:["industrial","ux"],bio:"美国设计师。RISD 罗德岛设计学院平面 + 工业设计 BFA(与 Brian Chesky 同班同学 + 室友)。2007 与 Chesky 在 SF 公寓提出 AirBed & Breakfast 想法。2008 Y Combinator,2009 改名 Airbnb。在 Airbnb 长期任 Chief Product Officer 直至 2022 年离任。",papers:[{y:"2008",t:"联合创立 Airbnb"},{y:"2014",t:"Airbnb Bélo 品牌重塑"}]},
  {id:"brianchesky",name:"Brian Chesky",org:"Airbnb",title:"Airbnb CEO · 工业设计师 / RISD",field:["industrial","ux"],bio:"美国工业设计师 + CEO。RISD 工业设计 BFA(2004),冰球队队长。Chesky 把设计驱动文化深植 Airbnb 产品/社区/品牌。2024 与 Jony Ive 的 LoveFrom 启动多年期合作,联合设计 Airbnb 产品改版。是少数把 RISD 设计教育延续到运营整个公司的 CEO 案例。",papers:[{y:"2008",t:"联合创立 Airbnb"},{y:"2024",t:"与 Jony Ive LoveFrom 战略合作"}]},
  {id:"mikematas",name:"Mike Matas",org:"独立 / Microsoft",title:"前苹果 iPhone/iPad UI 设计师 · Push Pop Press 创办人",field:["ux"],bio:"美国 UI 设计师。19 岁加入苹果 Human Interface 团队,参与原版 iPhone 设计:相机、相册、地图、设置。设计 iPad Photos app、Mac Time Machine、Photo Booth。后参与 Nest 智能恒温器设计。2010 创办 Push Pop Press(被 Facebook 收购)。Facebook Paper 主创。后创办 Lobe.ai(2018 被微软收购)。",papers:[{y:"2007",t:"原版 iPhone UI"},{y:"2014",t:"Facebook Paper"},{y:"2018",t:"Lobe.ai 卖给 Microsoft"}]},
  {id:"soleio",name:"Soleio Cuervo",org:"Combine VC",title:"前 Facebook 早期设计师 → Dropbox VP Design → Combine VC",field:["ux"],bio:"美国设计师 + 投资人。第 14 号 Facebook 员工,设计 Like 按钮、News Feed 早期版本。后任 Dropbox VP of Design。2017 创办 Combine VC,投资 Linear / Roam / Vercel / Loom 等设计驱动型公司。代表「Facebook 设计黑帮」以投资人身份在硅谷设计创业生态的重要节点。",papers:[{y:"2005",t:"Facebook 第 14 号员工"},{y:"2014",t:"Dropbox VP Design"},{y:"2017",t:"创办 Combine VC"}]},
  {id:"raunofreiberg",name:"Rauno Freiberg",org:"Vercel",title:"Vercel 高级 Design Engineer · 「设计 + 工程」代表",field:["ux"],bio:"爱沙尼亚设计师 + 前端工程师。Vercel Senior Design Engineer。在 X (@raunofreiberg) 上以高质量微交互/动效演示获 100K+ 关注,被视为 design engineering 这一新兴角色的标志人物。Vercel 官网首页那些丝滑动效大多出自他手。代表「设计师必须懂代码」的 AI native 时代趋势。",papers:[{y:"2022",t:"加入 Vercel"},{y:"2023",t:"Design Engineering 概念普及"}]},
  // ===== Apple Internal Team =====
  {id:"bashording",name:"Bas Ording",org:"Apple alum",title:"前苹果 UI 设计师 · iPhone 橡皮筋滚动发明者",field:["ux"],bio:"荷兰交互设计师。1998 年 Eindhoven 工业设计学院毕业后被 Steve Jobs 亲自招入苹果。15 年苹果生涯,主导 Mac OS X 的 Dock 放大效果、Exposé,以及 iPhone 最具标志性的「橡皮筋」滚动 (rubber band scrolling) + 惯性滚动 + 滑动解锁。这条「rubber band」演示在 2005 年点燃了 Steve Jobs 的「这就是手机」灵光一现。其滚动专利后被 Steve Jobs 用以起诉三星。后期离开苹果加入 Tesla(2013-)。",papers:[{y:"2005",t:"iPhone 橡皮筋滚动 demo"},{y:"2007",t:"iPhone 惯性滚动 / 滑动解锁"}]},
  {id:"imranchaudhri",name:"Imran Chaudhri",org:"Humane (ex-Apple)",title:"前苹果 HI 设计师 22 年 · Humane 联创",field:["ux"],bio:"出生于伦敦巴基斯坦裔。1995-2017 年在苹果担任 HI 设计师 22 年。原版 iPhone 软件 UI 团队核心成员之一,拥有 50+ 项苹果 UI 专利,涉及 iPad、Apple Watch、Vision Pro 早期概念。2017 与妻子 Bethany Bongiorno 离开苹果创立 Humane,2023 推出 AI Pin(失败),2024 卖给 HP。代表苹果设计黄金时代 HI 团队的灵魂人物之一。",papers:[{y:"2007",t:"原版 iPhone HI"},{y:"2015",t:"Apple Watch HI"},{y:"2023",t:"Humane AI Pin"}]},
  {id:"gregchristie",name:"Greg Christie",org:"Apple alum",title:"前苹果 HI 副总裁(2002-2014)",field:["ux"],bio:"美国 UI 设计师。1996 加入苹果,2002-2014 担任 Human Interface Group 副总裁。主导 Newton OS、Mac OS X、iPhone、iPad UI 设计。「Slide to Unlock」专利的合作发明人。在 Steve Jobs 时代直接对 Jobs 汇报,管理苹果整个 UI 设计团队。2014 离开苹果。",papers:[{y:"1990s",t:"Newton OS"},{y:"2007",t:"iPhone HI(VP 主管)"},{y:"2010",t:"iPad HI"}]},
  {id:"chrisstringer",name:"Christopher Stringer",org:"Apple alum",title:"前苹果 ID 团队核心(1995-2017)",field:["industrial"],bio:"英国工业设计师。1995 加入苹果工业设计团队,与 Jony Ive 共事 22 年。原版 iPhone、iPad、Apple Watch、AirPods 工业设计核心成员。在三星专利诉讼中作为苹果证人出庭,首次公开苹果设计部内部会议方式。2017 离开苹果。",papers:[{y:"2007",t:"原版 iPhone ID"},{y:"2010",t:"iPad ID"},{y:"2015",t:"Apple Watch ID"}]},
  {id:"bartandre",name:"Bart Andre",org:"Apple",title:"苹果 ID 团队元老(1992-)",field:["industrial"],bio:"加拿大工业设计师。1992 加入苹果工业设计团队,迄今 30+ 年,是 Apple ID 团队最长资历的成员之一。与 Jony Ive 共事整个黄金时代。Apple Watch 主要设计师之一。500+ 苹果硬件专利。Ive 离开后仍留在苹果 ID 团队,延续设计血脉。",papers:[{y:"1998",t:"iMac G3(团队成员)"},{y:"2015",t:"Apple Watch(主设计师)"}]},
  {id:"alandye",name:"Alan Dye",org:"Meta (ex-Apple)",title:"前苹果 HI 副总裁 · Liquid Glass 主导者 → Meta CDO",field:["ux","graphic"],bio:"美国设计师。Kate Spade 创意总监出身,2006 加入苹果做营销创意,2015 升任 Apple HI 副总裁(接 Jony Ive 设计大权 UI 部分)。主导 Apple Watch UI、iPhone X、Vision Pro UI,以及 2025 年发布的 Liquid Glass(iOS 26 全面视觉重构,材质化半透明界面语言,从 visionOS 演化而来)。2025 年 12 月被 Meta 以 Chief Design Officer 头衔挖走加入 Reality Labs,负责 Meta 全部硬件 + AI 产品设计。",papers:[{y:"2015",t:"任苹果 HI VP"},{y:"2017",t:"iPhone X UI"},{y:"2025",t:"Liquid Glass(iOS 26)"},{y:"2025",t:"加入 Meta 任 CDO"}]},
  {id:"billatkinson",name:"Bill Atkinson",org:"Apple alum",title:"原版 Mac 灵魂工程-设计师 · MacPaint / HyperCard",field:["ux"],bio:"1951 生,2025 去世。原版 Macintosh 团队核心成员。开发 QuickDraw 图形系统(让 Mac 能在像素级精确绘图)、MacPaint(1984,首个商业化绘图软件)、HyperCard(1987,被视为 Web 链接的前身)。在 Mac 工程团队是少数兼具技术深度 + 设计直觉的灵魂人物。与 Susan Kare、Andy Hertzfeld 同期。",papers:[{y:"1984",t:"MacPaint + QuickDraw"},{y:"1987",t:"HyperCard"}]},

  // ===== Braun(Rams 之外)=====
  {id:"fritzeichler",name:"Fritz Eichler",org:"Braun (1953-)",title:"博朗创意总监 · 招聘 Rams 的人",field:["industrial"],bio:"1911 生于卢森堡 Differdange,德国艺术史学家、画家、戏剧导演、产品设计师。1953 加入博朗最初为做广告片导演,迅速升任创意总监,定义博朗 1950s-60s 的整体设计哲学。是把 Hans Gugelot、Otl Aicher、Dieter Rams 等设计师招入博朗的关键人物。与 HfG Ulm 建立合作关系,把包豪斯传统通过 Ulm 学派带入博朗。",papers:[{y:"1953",t:"加入博朗任创意总监"},{y:"1955",t:"招聘 Dieter Rams"}]},
  {id:"hansgugelot",name:"Hans Gugelot",org:"HfG Ulm + Braun",title:"HfG Ulm 教授 · 与 Rams 合作 SK 4",field:["industrial"],bio:"1920 生于印尼,1965 早逝。德国-荷兰工业设计师。HfG Ulm(乌尔姆造型学院)关键人物。与 Dieter Rams 合作设计 1956 年的博朗 SK 4 唱机收音机(被昵称「白雪公主之棺」,MoMA 永久馆藏)。开创了德国战后理性主义工业设计语言,通过 Ulm 学派把包豪斯传统延续到战后德国。",papers:[{y:"1956",t:"Braun SK 4(与 Rams 合作)"},{y:"1958",t:"HfG Ulm 教授"}]},
  {id:"reinholdweiss",name:"Reinhold Weiss",org:"Braun (1959-1967)",title:"博朗设计师 · 与 Rams 同期",field:["industrial"],bio:"德国工业设计师。HfG Ulm 毕业。1959-1967 在博朗设计部门与 Dieter Rams、Hans Gugelot 共事。设计博朗多款厨房电器经典作品(吐司机 HT 2 等),首次为博朗引入「黑+银」配色组合(后成为博朗品牌标识)。1967 离开博朗自创工作室,后赴美芝加哥发展。",papers:[{y:"1961",t:"Braun HT 2 Toaster"}]},
  {id:"achillecastiglioni",name:"Achille Castiglioni",org:"Studio Castiglioni",title:"意大利工业设计大师 · 米兰理工教授",field:["industrial"],bio:"1918 生于米兰,2002 去世。米兰理工大学建筑系。与兄弟 Pier Giacomo / Livio 共同创立 Studio Castiglioni 1944,设计 Flos 灯具(Arco 弧光灯 1962、Snoopy 灯 1967、Toio 1962)、Zanotta、Alessi 产品。Compasso d'Oro 金奖 9 次(史上最多)。米兰理工大学建筑系教授(1969-1995),指导 Patricia Urquiola 等一代意大利设计师。1988 年获意大利总统颁发的 Gran Croce 大十字勋章。被誉为意大利战后产品设计的灵魂人物。",papers:[{y:"1962",t:"Arco 弧光灯(Flos)"},{y:"1962",t:"Toio 灯具"},{y:"1967",t:"Snoopy 灯"}]},

  // ===== Visual Identity / Brand 大公司创始人 =====
  {id:"ivanchermayeff",name:"Ivan Chermayeff",org:"Chermayeff & Geismar",title:"美国企业识别设计先驱(1932-2017)",field:["graphic"],bio:"1932 伦敦生,2017 NYC 去世。Harvard、Yale 艺术学院。父亲是建筑师 Serge Chermayeff。1957 与 Tom Geismar 联创 Chermayeff & Geismar(后改名 Chermayeff & Geismar & Haviv)。设计美国最经典企业 logo:NBC 孔雀(1986)、Mobil 飞马(1965)、PBS 人脸(1971)、Smithsonian、National Geographic、Pan Am、Chase 银行八边形(1961)。开创美国 mid-century 现代主义企业识别。AIGA 奖章 1979。",papers:[{y:"1957",t:"创办 Chermayeff & Geismar"},{y:"1961",t:"Chase 银行八边形 logo"},{y:"1986",t:"NBC 孔雀"}]},
  {id:"tomgeismar",name:"Tom Geismar",org:"Chermayeff & Geismar & Haviv",title:"Chermayeff & Geismar 联创(1957-)",field:["graphic"],bio:"1931 生,美国平面设计师。Brown 大学 + Yale 艺术学院。1957 与 Ivan Chermayeff 联创 Chermayeff & Geismar,职业生涯 65+ 年,设计 100+ 个全球企业 logo:Mobil(1964)、Chase(1961)、Burlington Industries、Best Products、Library of Congress 等。AIGA 奖章 1979。Smithsonian Cooper Hewitt 终身成就奖 2014。",papers:[{y:"1957",t:"联创 Chermayeff & Geismar"},{y:"1964",t:"Mobil 飞马 logo"}]},
  {id:"saghaviv",name:"Sagi Haviv",org:"Chermayeff & Geismar & Haviv",title:"C&G&H 现任合伙人 · 第三代",field:["graphic"],bio:"1974 以色列出生,在美国受教育。Cooper Union 平面设计 BFA。2003 加入 Chermayeff & Geismar,2006 升任合伙人(最年轻的合伙人),公司随后改名 Chermayeff & Geismar & Haviv。设计 Conservation International 三角 logo(2008)、Library of Congress、Harvard University Press、US Open 网球公开赛。AIGA 系列演讲常驻嘉宾。代表 C&G 60+ 年血脉的当代延续。",papers:[{y:"2008",t:"Conservation International logo"},{y:"2014",t:"US Open Tennis logo"}]},
  {id:"wallyolins",name:"Wally Olins",org:"Wolff Olins (cofounder)",title:"现代品牌咨询之父(1930-2014)",field:["graphic"],bio:"1930 伦敦生,2014 去世。St Anne's College Oxford。1965 与设计师 Michael Wolff 联创 Wolff Olins,定义了「企业识别」(corporate identity)作为咨询行业。设计英国电信 BT(1991)、Tate(2000)、奥运 + 奥姆勒姆 2012、Beats by Dre、Royal Mail。著作《Corporate Identity》(1989)、《On Brand》(2003)被视为品牌咨询圣经。CBE 1999。",papers:[{y:"1965",t:"联创 Wolff Olins"},{y:"1989",t:"Corporate Identity(book)"},{y:"2000",t:"Tate identity"}]},
  {id:"walterlandor",name:"Walter Landor",org:"Landor Associates",title:"美国包装设计先驱(1913-1995)",field:["graphic"],bio:"1913 慕尼黑生,1995 SF 去世。Goldsmiths College London。1941 移民美国,1941 创立 Landor Associates(SF)。开创现代消费品包装与品牌设计:Coca-Cola 经典曲线、Levi Strauss、Marlboro 红盒、FedEx(1994)、3M、Westinghouse。把消费者品牌咨询从单次设计转为系统化方法论。AIGA 奖章 1988。Landor 1989 被 WPP 收购,至今仍是全球最大品牌咨询公司之一。",papers:[{y:"1941",t:"创办 Landor Associates"},{y:"1955",t:"可口可乐曲线包装"},{y:"1994",t:"FedEx logo"}]},
  {id:"gertdumbar",name:"Gert Dumbar",org:"Studio Dumbar",title:"荷兰品牌设计学派 · Studio Dumbar 创始人",field:["graphic"],bio:"1940 生于印尼万隆(荷兰籍)。Royal College of Art London。1977 在海牙创立 Studio Dumbar。荷兰品牌设计学派代表:KPN(荷兰电信)、Dutch Police 警方、Dutch Postal Service、Apollo 阿波罗剧院、Royal Dutch Mint、Tate Britain。结合摄影、3D 道具与平面设计的「scenographic」方法论开创性地融合戏剧手法与企业识别。Royal Designer for Industry。",papers:[{y:"1977",t:"创立 Studio Dumbar"},{y:"1989",t:"Dutch PTT 设计系统"}]},

  // ===== Teenage Engineering co-founder =====
  {id:"davideriksson",name:"David Eriksson",org:"Teenage Engineering",title:"TE 联合创始人",field:["industrial","ux"],bio:"瑞典设计师。2005 与 Jesper Kouthoofd、Jens Rudberg、Erik Lundstedt 在斯德哥尔摩共同创立 Teenage Engineering。TE 以 OP-1 合成器(2011)、Pocket Operator、IKEA Frekvens 联名、Nothing 早期产品 Nothing CMF 合作著称。「玩具感 + 严肃合成器」美学定义了独立硬件 / 音乐设计圈的新方向。",papers:[{y:"2005",t:"联创 Teenage Engineering"},{y:"2011",t:"OP-1 合成器"}]},

  // ===== Chinese Designers 扩充 =====
  {id:"henrysteiner",name:"Henry Steiner",org:"Steiner & Co (HK)",title:"石汉瑞 · 香港平面设计之父 · Paul Rand 学生",field:["graphic","chinese"],bio:"1934 生于维也纳犹太家庭,纳粹兴起后逃往美国。Hunter College + Yale 艺术学院 MFA(师从 Paul Rand)。1961 受邀到香港任《亚洲杂志》设计总监,原计划 9 个月但定居至今。1964 创立 Steiner & Co。设计汇丰银行 HSBC 六边形 logo、渣打银行神话生物钞票、香港赛马会、香港置地、希尔顿香港。被誉为「香港平面设计之父」。AGI 资深会员。把东方符号融入西方现代主义平面设计的开创者。",papers:[{y:"1964",t:"创立 Steiner & Co"},{y:"1983",t:"汇丰银行六边形 logo"},{y:"2003",t:"渣打银行神话钞票系列"}]},
  {id:"freemanlau",name:"Freeman Lau",org:"KL&K Design",title:"刘小康 · KL&K Design 联创 · 椅子先生",field:["graphic","industrial","chinese"],bio:"1958 生于香港。香港理工大学设计学院。1996 与靳埭强联合创立靳与刘设计 KL&K Design Consultants。「椅子戏」系列以椅子为载体的视觉艺术(2005-)走遍世界博物馆。设计中国人寿、屈臣氏蒸馏水瓶等品牌识别。香港艺术发展局视觉艺术主席多届。深圳市政府文化与设计顾问。「香港 → 中国大陆」设计跨界的代表人物之一。",papers:[{y:"1996",t:"联创 KL&K Design"},{y:"2005",t:"椅子戏系列"}]},
  {id:"shidayu",name:"Shi Dayu",org:"Clay Architecture (Taiwan)",title:"石大宇 · 台湾设计师 · 竹工艺现代化",field:["industrial","chinese"],bio:"1964 生于纽约,在台湾长大。Parsons School of Design 工业设计 BFA。1995 创立清庭 Clay Architecture(台北)。专注东方材料(尤其竹)的当代设计:「椅琴剑」系列、「云水居」竹凳、「天工开物」家具。Compasso d'Oro 金奖入围。德国 Red Dot 至尊奖、Good Design Award。台湾 + 大陆设计圈代表把东方传统材料语言带入国际工业设计的人物。",papers:[{y:"1995",t:"创立清庭"},{y:"2010",t:"椅琴剑系列"}]},
  {id:"lizhiqian",name:"Li Zhiqian",org:"3type (三言)",title:"厉致谦 · 3type 创始人 · 字体设计新生代",field:["typography","chinese"],bio:"独立中文字体设计师 + 字体史研究者。Type is Beautiful (TIB) 资深成员/作者。2014 创立上海 3type(三言)字体工作室,出版《西文字体的故事》《字模 1 号:汉字字体设计》等重要中文字体书籍。中国当代「字体研究 + 出版 + 实验」三位一体的代表新生代,推动汉字现代字体设计走向更专业化。",papers:[{y:"2014",t:"创立 3type"},{y:"2018",t:"《字模 1 号》"}]},
  {id:"yingyonghui",name:"Ying Yonghui",org:"独立设计师 / TIB",title:"应永会 · 古字体研究 + 民国铅字复刻",field:["typography","chinese"],bio:"中国独立中文字体研究者 + 设计师。Type is Beautiful (TIB) 资深成员。专注复刻民国时期金属铅字、古代书法刻本字体,推出「方正民隶系列」「方正大颜楷」等复刻字体。把中国传统印刷文化与现代字库技术结合的独特路线代表。是中国字体研究领域少数能与朱志伟那一代字库元老对话的研究型设计师。",papers:[{y:"2010s",t:"民国铅字复刻系列"},{y:"2018s",t:"方正民隶字体"}]},
  // ===== ARCHITECTS — 经典现代主义 =====
  {id:"lecorbusier",name:"Le Corbusier",org:"独立工作室",title:"柯布西耶 · 现代主义建筑奠基人",field:["architect"],
    bio:"1887 生于瑞士拉绍德封,1965 去世。本名 Charles-Édouard Jeanneret-Gris。20 世纪最具影响力的现代主义建筑师。1923 著作《Towards a New Architecture》(《走向新建筑》)定义了现代主义建筑五原则:架空底层、屋顶花园、自由平面、横向长窗、自由立面。代表作:Villa Savoye(法国 Poissy 1931)、Notre-Dame du Haut(朗香教堂 1955)、Unité d'Habitation(马赛公寓 1952)、Chandigarh(印度规划)。Modulor 人体比例系统创始人。被公认为现代建筑之父。",
    papers:[{y:"1923",t:"Towards a New Architecture(著作)"},{y:"1925",t:"Villa La Roche-Jeanneret"},{y:"1931",t:"Villa Savoye 萨伏伊别墅"},{y:"1952",t:"Unité d'Habitation 马赛公寓"},{y:"1955",t:"Notre-Dame du Haut 朗香教堂"},{y:"1953",t:"Chandigarh 印度昌迪加尔规划"},{y:"1960",t:"La Tourette 修道院"},{y:"1963",t:"Carpenter Center Harvard(美国唯一作品)"}]},
  {id:"flwright",name:"Frank Lloyd Wright",org:"Taliesin Fellowship",title:"美国有机建筑创始人",field:["architect"],
    bio:"1867-1959。美国建筑师,定义「有机建筑」(Organic Architecture)——建筑应与环境融合。代表作:Fallingwater(流水别墅 1935,Pennsylvania)、Solomon R. Guggenheim Museum(纽约古根海姆 1959)、Robie House(芝加哥 1910)、Taliesin West(亚利桑那)。Prairie Style(草原派)开创者,影响整个美国 20 世纪住宅建筑。AIA Gold Medal 1949。一生设计 1000+ 项目,完成 532 个。",
    papers:[{y:"1903",t:"Larkin Building 拉金大厦"},{y:"1908",t:"Unity Temple"},{y:"1910",t:"Robie House 罗比之家"},{y:"1922",t:"Tokyo Imperial Hotel 东京帝国饭店"},{y:"1935",t:"Fallingwater 流水别墅"},{y:"1937",t:"Taliesin West(亚利桑那)"},{y:"1939",t:"Johnson Wax 总部大厦"},{y:"1959",t:"Guggenheim Museum 纽约古根海姆"}]},
  {id:"miesvanderrohe",name:"Mies van der Rohe",org:"Bauhaus → IIT Chicago",title:"包豪斯第三任校长 · 'less is more'",field:["architect"],
    bio:"1886 生于德国亚琛,1969 去世。Ludwig Mies van der Rohe。1930-1933 任包豪斯第三任(末任)校长。1937 移民美国任 IIT(伊利诺伊理工)建筑系主任。代表作:Barcelona Pavilion(1929)、Farnsworth House(伊利诺伊 1951)、Seagram Building(纽约 1958,与 Philip Johnson 合作)、Crown Hall(IIT 1956)。「Less is more」与「God is in the details」名言。20 世纪最重要的现代主义建筑师之一。",
    papers:[{y:"1929",t:"Barcelona Pavilion 巴塞罗那馆"},{y:"1929",t:"Barcelona Chair 巴塞罗那椅"},{y:"1951",t:"Farnsworth House 范斯沃斯住宅"},{y:"1956",t:"Crown Hall IIT"},{y:"1958",t:"Seagram Building 西格拉姆大厦"},{y:"1968",t:"Neue Nationalgalerie 柏林新国家美术馆"}]},
  {id:"waltergropius",name:"Walter Gropius",org:"Bauhaus 创始人",title:"包豪斯创始人 · 现代设计教育奠基人",field:["architect"],
    bio:"1883 生于柏林,1969 去世。1919 在魏玛创立包豪斯(Bauhaus)——20 世纪最有影响力的设计学院。1928 离开包豪斯。1937 移民美国,任 Harvard Graduate School of Design 建筑系主任(直至 1952),培养包括贝聿铭在内的整代美国建筑师。代表作:Bauhaus Dessau Building(1925)、Fagus Factory(1911)、Pan Am Building(纽约 1963)。把现代设计教育与工业化建造方法体系化的奠基人。",
    papers:[{y:"1911",t:"Fagus Factory 法古斯工厂"},{y:"1919",t:"创立 Bauhaus 包豪斯"},{y:"1925",t:"Bauhaus Dessau 德绍校舍"},{y:"1937",t:"任 Harvard GSD 系主任"},{y:"1937",t:"创立 TAC 协合建筑师事务所"},{y:"1963",t:"Pan Am Building 纽约泛美大厦"}]},
  {id:"alvaraalto",name:"Alvar Aalto",org:"Aalto Studio",title:"芬兰现代主义代表 · 人本主义建筑",field:["architect"],
    bio:"1898-1976。芬兰建筑师 + 设计师 + 城市规划师。代表「人本主义现代主义」——把现代主义的几何理性与自然材料(木材)、有机曲线融合。代表作:Paimio Sanatorium(1933)、Villa Mairea(1939)、Finlandia Hall(赫尔辛基 1971)。同时是家具设计先驱:Aalto Stool 60(1933)凳子至今仍在生产。AIA Gold Medal 1963。芬兰 50 元钞票上的人物。",
    papers:[{y:"1933",t:"Paimio Sanatorium 帕米奥结核病疗养院"},{y:"1933",t:"Stool 60(家具,至今生产)"},{y:"1936",t:"Savoy Vase 花瓶"},{y:"1939",t:"Villa Mairea"},{y:"1949",t:"MIT Baker House 宿舍(美国)"},{y:"1951",t:"Säynätsalo Town Hall"},{y:"1971",t:"Finlandia Hall 芬兰大厦"}]},
  {id:"louiskahn",name:"Louis Kahn",org:"University of Pennsylvania",title:"美国当代建筑诗人(1901-1974)",field:["architect"],
    bio:"1901 生于爱沙尼亚,1974 去世。1924 成为美国公民。被誉为现代主义晚期的建筑诗人。代表作:Salk Institute(加州 La Jolla 1965)、Kimbell Art Museum(得州 Fort Worth 1972)、National Assembly Building(孟加拉首都 1982,死后完工)、Yale Center for British Art(纽黑文 1977)。强调材料(混凝土、砖)+ 自然光 + 几何形体的诗意表达。AIA Gold Medal 1971。",
    papers:[{y:"1953",t:"Yale Art Gallery(首个重要作品)"},{y:"1965",t:"Salk Institute 索尔克研究所"},{y:"1965",t:"Phillips Exeter 学院图书馆"},{y:"1972",t:"Kimbell Art Museum 金贝尔美术馆"},{y:"1977",t:"Yale Center for British Art"},{y:"1982",t:"孟加拉国会大厦(死后完工)"}]},

  // ===== ARCHITECTS — 当代国际大师 =====
  {id:"impei",name:"I.M. Pei",org:"Pei Cobb Freed",title:"贝聿铭 · 现代主义大师 · Pritzker 1983",field:["architect"],
    bio:"1917 生于广州,2019 去世。麻省理工建筑学士(1940)+ 哈佛设计学院硕士(1946,师从 Walter Gropius)。1955 创办 I.M. Pei & Partners(后改名 Pei Cobb Freed)。Pritzker Prize 1983。代表作:John F. Kennedy Library(波士顿 1979)、East Building of National Gallery of Art(华盛顿 1978)、Bank of China Tower(香港中银大厦 1990)、Louvre Pyramid(罗浮宫玻璃金字塔 1989)、Suzhou Museum(苏州博物馆 2006)、Museum of Islamic Art(多哈 2008)。被认为是把现代主义带到全球公共建筑的代表。AIA Gold Medal 1979。",
    papers:[{y:"1978",t:"East Building National Gallery 华盛顿"},{y:"1979",t:"JFK 总统图书馆 波士顿"},{y:"1982",t:"香山饭店 北京"},{y:"1989",t:"Louvre Pyramid 罗浮宫玻璃金字塔"},{y:"1990",t:"Bank of China Tower 香港中银大厦"},{y:"1995",t:"Rock & Roll Hall of Fame"},{y:"1997",t:"Miho Museum 美秀美术馆(日本)"},{y:"2006",t:"苏州博物馆"},{y:"2008",t:"Doha Museum of Islamic Art"}]},
  {id:"frankgehry",name:"Frank Gehry",org:"Gehry Partners",title:"解构主义代表 · Pritzker 1989",field:["architect"],
    bio:"1929 生于多伦多。USC 建筑学士。1962 创立 Frank O. Gehry & Associates(LA)。Pritzker Prize 1989。代表作:Guggenheim Museum Bilbao(1997,改变了一个城市的命运)、Walt Disney Concert Hall(LA 2003)、Dancing House(布拉格 1996)、Fondation Louis Vuitton(巴黎 2014)、8 Spruce Street(NYC 2011)。把数字 3D 建模(CATIA 软件)用于复杂曲面建筑的先驱。「毕尔巴鄂效应」(单一文化建筑振兴整座城市)的代名词。AIA Gold Medal 1999。",
    papers:[{y:"1979",t:"Gehry Residence(自宅 Santa Monica)"},{y:"1989",t:"Vitra Design Museum"},{y:"1996",t:"Dancing House 布拉格跳舞房子"},{y:"1997",t:"Guggenheim Museum Bilbao 毕尔巴鄂"},{y:"2003",t:"Walt Disney Concert Hall LA"},{y:"2004",t:"MIT Stata Center"},{y:"2011",t:"8 Spruce Street NYC"},{y:"2014",t:"Fondation Louis Vuitton 巴黎"}]},
  {id:"zahahadid",name:"Zaha Hadid",org:"Zaha Hadid Architects",title:"扎哈 · 参数化建筑女王 · Pritzker 2004",field:["architect"],
    bio:"1950 生于巴格达,2016 去世。AA 建筑联盟学院 London(师从 Rem Koolhaas)。1980 创立 Zaha Hadid Architects(伦敦)。Pritzker Prize 2004(首位女性获奖者)。代表作:Vitra Fire Station(德国 1993,首个建成项目)、MAXXI(罗马 2010)、London Aquatics Centre(2012 奥运)、Heydar Aliyev Center(巴库 2012)、北京大兴国际机场(与 ADP 合作 2019)。开创 parametricism(参数化建筑)流派,定义 21 世纪流体建筑形态语言。",
    papers:[{y:"1993",t:"Vitra Fire Station(首个建成)"},{y:"2008",t:"BMW Plant Leipzig"},{y:"2010",t:"MAXXI Museum 罗马"},{y:"2012",t:"London Aquatics 伦敦奥运水上中心"},{y:"2012",t:"Heydar Aliyev Center 巴库"},{y:"2014",t:"Galaxy SOHO 北京"},{y:"2018",t:"Morpheus Hotel 澳门"},{y:"2019",t:"北京大兴机场(联合设计)"}]},
  {id:"remkoolhaas",name:"Rem Koolhaas",org:"OMA",title:"库哈斯 · OMA 创始人 · 央视大楼",field:["architect"],
    bio:"1944 生于鹿特丹。AA 建筑联盟学院 London + Cornell。前荷兰电视台记者+剧作家。1975 在伦敦联创 Office for Metropolitan Architecture(OMA)。Pritzker Prize 2000。代表作:Seattle Central Library(2004)、CCTV Headquarters(北京央视新大楼 2012,「大裤衩」)、Casa da Música(波尔图 2005)、Prada Foundation(米兰 2018)。理论著作《Delirious New York》(1978)、《S, M, L, XL》(1995)定义了当代建筑思想方法论。Harvard 教授,培养 Bjarke Ingels 等下一代建筑师。",
    papers:[{y:"1978",t:"Delirious New York(著作)"},{y:"1995",t:"S, M, L, XL(著作)"},{y:"2004",t:"Seattle Central Library 西雅图中央图书馆"},{y:"2005",t:"Casa da Música 波尔图音乐之家"},{y:"2010",t:"Garage Museum 莫斯科"},{y:"2012",t:"CCTV Headquarters 北京央视新大楼"},{y:"2018",t:"Prada Foundation Milan"}]},
  {id:"normanfoster",name:"Norman Foster",org:"Foster + Partners",title:"福斯特 · High-Tech 建筑代表 · Pritzker 1999",field:["architect"],
    bio:"1935 生于曼彻斯特。Manchester School of Architecture + Yale(与 Richard Rogers 同学)。1967 创立 Foster Associates(后改名 Foster + Partners)。Pritzker Prize 1999。代表作:HSBC Hong Kong(1985)、Hong Kong International Airport(1998)、30 St Mary Axe 'The Gherkin'(伦敦 2003)、Apple Park(库比蒂诺 2017,与 Jony Ive 合作)、Reichstag dome(柏林 1999)。代表「High-Tech Architecture」流派——把工程结构作为建筑表达。Lord Foster of Thames Bank(终身贵族)。",
    papers:[{y:"1985",t:"HSBC Hong Kong 汇丰香港总部"},{y:"1998",t:"Hong Kong International Airport"},{y:"1999",t:"Reichstag Dome 柏林国会大厦穹顶"},{y:"2003",t:"30 St Mary Axe 'Gherkin'(伦敦小黄瓜)"},{y:"2004",t:"Millau Viaduct 米约高架桥(法国)"},{y:"2008",t:"北京首都机场 T3 航站楼"},{y:"2013",t:"Bloomberg HQ London"},{y:"2017",t:"Apple Park 库比蒂诺(与 Jony Ive 合作)"}]},
  {id:"renzopiano",name:"Renzo Piano",org:"Renzo Piano Building Workshop",title:"皮亚诺 · Pritzker 1998",field:["architect"],
    bio:"1937 生于热那亚,意大利建筑师。米兰理工建筑学位。1971 与 Richard Rogers 合作设计 Centre Pompidou(巴黎蓬皮杜中心 1977,把建筑结构外露的开创性设计)。1981 创办 Renzo Piano Building Workshop。Pritzker Prize 1998。代表作:Pompidou Centre(1977)、Kansai International Airport(大阪关西国际机场 1994)、The Shard(伦敦碎片大厦 2012,西欧最高建筑)、Whitney Museum NYC(2015)、Stavros Niarchos Cultural Center(雅典 2016)。",
    papers:[{y:"1977",t:"Centre Pompidou 蓬皮杜中心(与 Rogers)"},{y:"1994",t:"Kansai International Airport 关西机场"},{y:"1998",t:"Beyeler Foundation 巴塞尔"},{y:"2012",t:"The Shard 伦敦碎片大厦(西欧最高)"},{y:"2015",t:"Whitney Museum NYC 惠特尼"},{y:"2016",t:"Stavros Niarchos Cultural Center 雅典"}]},
  {id:"jeannouvel",name:"Jean Nouvel",org:"Ateliers Jean Nouvel",title:"努维尔 · 法国当代建筑 · Pritzker 2008",field:["architect"],
    bio:"1945 生于法国。École des Beaux-Arts Paris。1981 创立 Ateliers Jean Nouvel(巴黎)。Pritzker Prize 2008。代表作:Institut du Monde Arabe(巴黎阿拉伯世界研究中心 1987)、Torre Agbar(巴塞罗那 2005)、Musée du quai Branly(2006)、Louvre Abu Dhabi(2017)、Philharmonie de Paris(巴黎爱乐厅 2015)、National Museum of Qatar(2019)。把当地文化符号融入现代主义建筑形态语言。Praemium Imperiale 2001。",
    papers:[{y:"1987",t:"Institut du Monde Arabe 阿拉伯世界研究中心"},{y:"2005",t:"Torre Agbar 巴塞罗那"},{y:"2006",t:"Musée du quai Branly 巴黎"},{y:"2015",t:"Philharmonie de Paris 巴黎爱乐厅"},{y:"2017",t:"Louvre Abu Dhabi 阿布扎比卢浮宫"},{y:"2019",t:"National Museum of Qatar"}]},
  {id:"tadaoando",name:"Tadao Ando",org:"Tadao Ando Architect & Associates",title:"安藤忠雄 · 清水混凝土代表 · Pritzker 1995",field:["architect"],
    bio:"1941 生于大阪。前职业拳击手,自学建筑(无正式学位)。1969 创办安藤忠雄建筑研究所(大阪)。Pritzker Prize 1995。代表作:Church of the Light(光之教堂 大阪茨木 1989)、Awaji Yumebutai(淡路梦舞台 2000)、Modern Art Museum of Fort Worth(德州 2002)、Punta della Dogana(威尼斯 2009)、上海保利大剧院(2014)。「清水混凝土 + 几何 + 自然光」三位一体的禅意建筑语言。日本文化勋章。",
    papers:[{y:"1988",t:"Church on the Water 水之教堂(北海道)"},{y:"1989",t:"Church of the Light 光之教堂(大阪茨木)"},{y:"1995",t:"Naoshima Benesse 直岛美术馆"},{y:"2000",t:"Awaji Yumebutai 淡路梦舞台"},{y:"2002",t:"Modern Art Museum 沃斯堡(德州)"},{y:"2009",t:"Punta della Dogana 威尼斯"},{y:"2014",t:"上海保利大剧院"}]},
  {id:"toyoito",name:"Toyo Ito",org:"Toyo Ito & Associates",title:"伊东丰雄 · 日本建筑师 · Pritzker 2013",field:["architect"],
    bio:"1941 生于韩国京城(日本籍),东京大学建筑系。1971 创立工作室。Pritzker Prize 2013。代表作:Sendai Mediatheque(仙台媒体中心 2001)、Tama Art University Library(2007)、Toyo Ito Museum of Architecture(今治 2011)、Taichung Metropolitan Opera House(台中歌剧院 2016)。培养 Kazuyo Sejima 妹岛和世(SANAA)等下一代日本建筑师。代表「轻盈建筑」(Architecture of Lightness)和有机曲面探索。",
    papers:[{y:"2001",t:"Sendai Mediatheque 仙台媒体中心"},{y:"2002",t:"Serpentine Gallery Pavilion(伦敦)"},{y:"2007",t:"Tama Art University Library 多摩美大图书馆"},{y:"2011",t:"Toyo Ito Museum 今治"},{y:"2016",t:"台中歌剧院"}]},
  {id:"kazuyosejima",name:"Kazuyo Sejima",org:"SANAA",title:"妹岛和世 · SANAA 联创 · Pritzker 2010",field:["architect"],
    bio:"1956 生于茨城县,日本女建筑师。日本女子大学(师从伊东丰雄事务所)。1995 与 Ryue Nishizawa 创立 SANAA。Pritzker Prize 2010(与 Nishizawa 共同获奖)。代表作:Christian Dior Building Omotesando(2003)、21st Century Museum of Contemporary Art Kanazawa(金泽 21 世纪美术馆 2004)、New Museum NYC(2007)、Rolex Learning Center(EPFL 洛桑 2010)、Louvre-Lens(2012)。极致透明、白色、流动平面的极简建筑代表。",
    papers:[{y:"2003",t:"Christian Dior Omotesando 表参道"},{y:"2004",t:"金泽 21 世纪美术馆"},{y:"2006",t:"Toledo Museum Glass Pavilion"},{y:"2007",t:"New Museum NYC"},{y:"2010",t:"Rolex Learning Center EPFL 洛桑"},{y:"2012",t:"Louvre-Lens(卢浮宫朗斯分馆)"}]},
  {id:"shigeruban",name:"Shigeru Ban",org:"Shigeru Ban Architects",title:"坂茂 · 纸建筑 · Pritzker 2014",field:["architect"],
    bio:"1957 生于东京。Cooper Union NYC 建筑学位。1985 创立 Shigeru Ban Architects(东京)。Pritzker Prize 2014。开创「纸管建筑」——用纸管作为结构性材料,主要应用于人道主义建筑(灾后避难所)。代表作:Centre Pompidou-Metz(梅斯蓬皮杜中心 2010)、Aspen Art Museum(2014)、Cardboard Cathedral(克赖斯特彻奇 2013,新西兰地震后)、Mt. Fuji World Heritage Centre(2017)、Oita Prefectural Art Museum。Voluntary Architects' Network(VAN)创办人,人道主义建筑代表。",
    papers:[{y:"1995",t:"Paper Log Houses(神户地震难民屋)"},{y:"2010",t:"Centre Pompidou-Metz 梅斯蓬皮杜"},{y:"2013",t:"Cardboard Cathedral 纸教堂(克赖斯特彻奇)"},{y:"2014",t:"Aspen Art Museum"},{y:"2017",t:"Mt. Fuji World Heritage Centre"},{y:"2017",t:"Oita Prefectural Art Museum"}]},
  {id:"aratisozaki",name:"Arata Isozaki",org:"Arata Isozaki & Associates",title:"矶崎新 · 日本后现代建筑 · Pritzker 2019",field:["architect"],
    bio:"1931 生于大分县,2022 去世。东京大学建筑(师从丹下健三)。1963 创立工作室。Pritzker Prize 2019(高龄 87 岁获奖)。代表作:Tsukuba Center Building(筑波中心 1983)、MOCA Los Angeles(1986)、Domus(西班牙 1995)、Palau Sant Jordi(巴塞罗那奥运体育馆 1992)、Qatar National Convention Centre(2011)、上海喜马拉雅中心(2010)、Palau Sant Jordi。日本最具国际经验的后现代主义建筑师,把日本建筑师推向世界舞台的关键人物。",
    papers:[{y:"1983",t:"Tsukuba Center Building 筑波中心"},{y:"1986",t:"MOCA Los Angeles"},{y:"1990",t:"Disney Team Building Florida"},{y:"1992",t:"Palau Sant Jordi 巴塞罗那奥运体育馆"},{y:"2004",t:"Shenzhen Cultural Center 深圳"},{y:"2010",t:"上海喜马拉雅中心"},{y:"2011",t:"Qatar National Convention Centre"}]},
  {id:"herzogdemeuron",name:"Herzog & de Meuron",org:"Herzog & de Meuron",title:"瑞士双人组合 · 鸟巢联合设计 · Pritzker 2001",field:["architect"],
    bio:"Jacques Herzog(1950-)和 Pierre de Meuron(1950-)瑞士建筑师双人组合,1978 在巴塞尔联创 Herzog & de Meuron。同获 Pritzker Prize 2001。代表作:Tate Modern(伦敦 2000,把废弃发电厂改造成全球最受欢迎美术馆)、Beijing National Stadium(鸟巢 2008,与艾未未 + 李兴钢合作)、Allianz Arena(慕尼黑 2005)、de Young Museum(SF 2005)、Elbphilharmonie(汉堡 2017)。把材料表面、纹理、立面作为建筑表达核心。",
    papers:[{y:"2000",t:"Tate Modern 伦敦泰特现代美术馆"},{y:"2005",t:"Allianz Arena 慕尼黑安联球场"},{y:"2005",t:"de Young Museum 旧金山"},{y:"2008",t:"Beijing 鸟巢国家体育场(与艾未未/李兴钢)"},{y:"2008",t:"VitraHaus 家具展示馆"},{y:"2013",t:"Pérez Art Museum Miami"},{y:"2017",t:"Elbphilharmonie 汉堡易北爱乐厅"}]},
  {id:"santiagocalatrava",name:"Santiago Calatrava",org:"Santiago Calatrava Architects",title:"卡拉特拉瓦 · 建筑+工程师·桥梁建筑大师",field:["architect"],
    bio:"1951 生于西班牙瓦伦西亚。瓦伦西亚理工 + ETH Zürich 工程博士。同时持有建筑师 + 工程师执照。1981 创立工作室。代表作:City of Arts and Sciences(瓦伦西亚 1998)、Turning Torso(瑞典马尔默 2005,扭转大厦)、Auditorio de Tenerife(2003)、World Trade Center Transportation Hub(纽约 2016,Oculus 白色翼骨)、Liège-Guillemins railway station(2009)。把生物形态(骨骼/翅膀)与工程结构融合的代表。",
    papers:[{y:"1992",t:"Alamillo Bridge 塞维利亚"},{y:"1998",t:"City of Arts and Sciences Valencia 瓦伦西亚艺术与科学城"},{y:"2003",t:"Auditorio de Tenerife 特内里费音乐厅"},{y:"2005",t:"Turning Torso 瑞典扭转大厦"},{y:"2009",t:"Liège-Guillemins Station 列日火车站"},{y:"2016",t:"NYC WTC Oculus 世贸中心交通枢纽"}]},
  {id:"bjarkeingels",name:"Bjarke Ingels",org:"BIG",title:"BIG 创始人 · 丹麦新生代建筑师",field:["architect"],
    bio:"1974 生于哥本哈根。Royal Danish Academy + Barcelona ETSAB。曾在 OMA(Rem Koolhaas)工作。2005 创立 BIG(Bjarke Ingels Group)。代表作:Mountain Dwellings(哥本哈根 2008)、8 House(2010)、Via 57 West(NYC 2016)、CopenHill(哥本哈根滑雪场+垃圾发电厂 2019)、Lego House(比隆 2017)、Google Bay View(山景城 2022,与 Heatherwick Studio 合作)。代表「Hedonistic Sustainability」(享乐式可持续设计)新一代建筑哲学。Time 100 Most Influential 2016。",
    papers:[{y:"2008",t:"Mountain Dwellings 山型公寓"},{y:"2010",t:"8 House(哥本哈根)"},{y:"2016",t:"Via 57 West NYC"},{y:"2017",t:"Lego House Billund 乐高之家"},{y:"2019",t:"CopenHill 滑雪场+垃圾发电厂"},{y:"2022",t:"Google Bay View(山景城)"},{y:"2022",t:"Twist Museum 挪威"}]},
  {id:"peterzumthor",name:"Peter Zumthor",org:"Atelier Peter Zumthor",title:"祖姆托 · 极简材料诗人 · Pritzker 2009",field:["architect"],
    bio:"1943 生于瑞士巴塞尔。Pratt Institute(NYC)。1979 在瑞士 Haldenstein 山区创立工作室,至今仅 30 余项目(刻意控制规模)。Pritzker Prize 2009。代表作:Therme Vals(瑞士瓦尔斯温泉浴场 1996)、Kunsthaus Bregenz(布雷根茨美术馆 1997)、Kolumba Museum(科隆 2007)、Saint Benedict Chapel(瑞士 1988)、Bruder Klaus Field Chapel(德国 2007)。最坚持「场所精神」(Genius Loci)、极致材料质感的当代建筑诗人。",
    papers:[{y:"1988",t:"Saint Benedict Chapel 瑞士"},{y:"1996",t:"Therme Vals 瓦尔斯温泉浴场"},{y:"1997",t:"Kunsthaus Bregenz 布雷根茨美术馆"},{y:"2007",t:"Kolumba Museum Köln 科隆"},{y:"2007",t:"Bruder Klaus Field Chapel(德国田野教堂)"}]},
